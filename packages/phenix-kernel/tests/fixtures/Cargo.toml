[package]
name = "host-portable-consumer"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
default = ["independently-compiled-consumer"]
independently-compiled-consumer = []

[dependencies]
phenix-kernel = { path = "../../" }
phenix-graph = { path = "../../../phenix-graphs" }
phenix-plugin = { path = "../../../phenix-plugins" }

[lib]
path = "host_portable_consumer.rs"

[[test]]
name = "host_portable_contracts"
path = "../host_portable_contracts.rs"
required-features = ["independently-compiled-consumer"]
