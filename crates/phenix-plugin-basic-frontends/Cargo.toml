[package]
name = "phenix-plugin-basic-frontends"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["terminal"]
terminal = []
jsonl = []
acp = ["dep:agent-client-protocol-schema"]

[dependencies]
phenix-sdk = { path = "../phenix-sdk" }
phenix-basic-contracts = { path = "../phenix-basic-contracts" }
serde = { workspace = true }
serde_json = { workspace = true }
agent-client-protocol-schema = { version = "=1.11.0", default-features = false, optional = true }
