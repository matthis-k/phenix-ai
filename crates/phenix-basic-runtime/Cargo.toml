[package]
name = "phenix-basic-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Enables only an incomplete SDK v2 initialize handshake for development.
# The packaged Basic ACP host uses the stable-v1 builder by default.
acp_v2_preview = []
graph-v2 = []

[dependencies]
zeroize = "=1.9.1"
phenix-basic-contracts = { path = "../phenix-basic-contracts" }
phenix-environment-contracts = { path = "../phenix-environment-contracts" }
phenix-provider-contracts = { path = "../phenix-provider-contracts" }
phenix-contract.workspace = true
phenix-kernel = { path = "../phenix-kernel" }
phenix-sdk = { path = "../phenix-sdk" }
serde.workspace = true
serde_json.workspace = true
agent-client-protocol = { version = "=3.3.0", features = ["stdio", "unstable_protocol_v2"] }
futures = { version = "0.3", features = ["executor"] }
blocking = "1"
