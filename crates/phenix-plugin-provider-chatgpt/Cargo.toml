[package]
name = "phenix-plugin-provider-chatgpt"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
phenix-sdk = { path = "../phenix-sdk" }
phenix-provider-contracts = { path = "../phenix-provider-contracts" }
phenix-basic-contracts = { path = "../phenix-basic-contracts" }
phenix-provider-builtins = { path = "../phenix-provider-builtins" }
phenix-provider-auth-strategies = { path = "../phenix-provider-auth-strategies", features = ["oauth-browser"] }
phenix-provider-discovery = { path = "../phenix-provider-discovery" }
phenix-provider-protocols = { path = "../phenix-provider-protocols", features = ["siwc-verified", "model-codecs"] }
serde.workspace = true
serde_json.workspace = true
zeroize = "=1.9.1"
uuid = { version = "=1.28.0", features = ["v4"] }
curl = { version = "0.4", default-features = false }
