[package]
name = "phenix-provider-protocols"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
oauth2-pkce = ["dep:openidconnect"]
oauth-loopback = ["oauth2-pkce", "dep:serde_json"]
siwc-verified = ["oauth-loopback", "openidconnect/reqwest-blocking", "openidconnect/rustls-tls"]
model-codecs = ["dep:phenix-sdk", "dep:phenix-basic-contracts", "dep:serde_json", "dep:sse-parse"]

[dependencies]
zeroize = "=1.9.1"
url = "=2.5.8"
phenix-sdk = { path = "../phenix-sdk", optional = true }
phenix-basic-contracts = { path = "../phenix-basic-contracts", optional = true }
serde_json = { workspace = true, optional = true }
openidconnect = { version = "=4.0.1", default-features = false, optional = true }
sse-parse = { version = "=0.1.0", optional = true }
