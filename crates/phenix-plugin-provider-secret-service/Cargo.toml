[package]
name = "phenix-plugin-provider-secret-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
phenix-sdk = { path = "../phenix-sdk" }
phenix-provider-contracts = { path = "../phenix-provider-contracts" }
keyring-core = { version = "=1.0.1", default-features = false }
zbus-secret-service-keyring-store = { version = "=1.0.1", default-features = false, features = ["rt-async-io-crypto-rust"] }
