name: Temporary physical Nix isolation evidence
on:
  pull_request:
    paths:
      - .github/scripts/basic-plugin-cache-evidence.py
      - .github/workflows/basic-plugin-physical-probe.yml

# This branch-local workflow is an experimental probe only. It must be
# deleted before merging the permanent evidence-harness improvement.
permissions:
  contents: read

jobs:
  physical-evidence:
    if: github.head_ref == 'ci/physical-incremental-evidence-20261020'
    name: Controlled H-only Nix materialization
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: Validate collector
        run: python3 -m py_compile .github/scripts/basic-plugin-cache-evidence.py
      - name: Pre-realize optional HTTP Model then change verification composition
        run: |
          bash .github/scripts/test-basic-plugin-cache-isolation.sh \
            --build --no-warm --cases H \
            --build-cases H \
            --output physical-ci-evidence
      - name: Retain success or failure evidence and actual Nix logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: physical-nix-evidence
          path: physical-ci-evidence/
          if-no-files-found: warn
