# Independent protocol compatibility test. The SDK belongs only to this
# test crate; it must not become a dependency of the Phenix kernel or host.
name: P1 official ACP SDK interop
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only the newest source commit needs PR evidence. Manual and push runs
# retain independent identities and are never cancelled by a PR update.
concurrency:
  group: p1-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  official-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/install-nix-action@v31
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/acp-sdk-client
      - name: Validate independent ACP client formatting
        run: cargo fmt --manifest-path tests/acp-sdk-client/Cargo.toml --all -- --check
      # SDK and packaged Nix host builds are independent. Compile in
      # parallel and require *both* exits before interoperability checks.
      - name: Build ACP host and independent SDK client concurrently
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path tests/acp-sdk-client/Cargo.toml --release > "$RUNNER_TEMP/acp-client-build.log" 2>&1 &
          sdk_pid=$!
          trap 'kill "$sdk_pid" 2>/dev/null || true' EXIT
          host_rc=0
          nix build .#phenix-basic-acp -L --out-link result-acp || host_rc=$?
          sdk_rc=0
          wait "$sdk_pid" || sdk_rc=$?
          cat "$RUNNER_TEMP/acp-client-build.log"
          test "$host_rc" -eq 0
          test "$sdk_rc" -eq 0
      - name: Exercise host through official stable-v1 SDK
        timeout-minutes: 3
        env:
          RUST_BACKTRACE: "1"
        run: |
          set -euo pipefail
          export PHENIX_BASIC_SQLITE_PATH="$RUNNER_TEMP/phenix-p1-official-acp.db"
          tests/acp-sdk-client/target/release/phenix-p1-acp-client-check \
            "$PWD/result-acp/bin/phenix-basic-acp"
      - name: Require bounded SDK stdio input
        timeout-minutes: 2
        run: |
          python tests/acp-sdk-frame-bounds.py "$PWD/result-acp/bin/phenix-basic-acp"
      - name: Build opt-in official SDK v1/v2 router
        timeout-minutes: 10
        run: |
          nix build .#phenix-basic-composition --out-link result-composition
          cargo build --locked -p phenix-basic-runtime --features acp_v2_preview
      - name: Verify official v1/v2 SDK negotiation on preview host
        timeout-minutes: 4
        env:
          RUST_BACKTRACE: "1"
        run: |
          cargo run --locked --manifest-path tests/acp-sdk-client/Cargo.toml --release \
            --bin v2-init-preview -- \
            "$PWD/target/debug/phenix-basic-runtime" acp "$PWD/result-composition"
      - name: Record SDK dependency resolution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-acp-sdk-lock-${{ github.sha }}
          path: tests/acp-sdk-client/Cargo.lock
          if-no-files-found: ignore
