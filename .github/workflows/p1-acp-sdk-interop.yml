# Independent official SDK client tested against the SDK-backed Phenix ACP
# host over stdio. The generic Phenix kernel must not depend on this protocol;
# host and test client may both use the same maintained SDK crate.
name: P1 official ACP SDK interop
on:
  pull_request:
    paths:
      - "crates/phenix-basic-runtime/**"
      - "crates/phenix-plugin-basic-frontends/**"
      - "tests/acp-sdk-client/**"
      - "tests/acp-sdk-frame-bounds.py"
      - "flake.nix"
      - ".github/workflows/p1-acp-sdk-interop.yml"
  workflow_dispatch:

permissions:
  contents: read

# Each PR needs exact-head verification, never simultaneous stale-head
# compilations. Scope by workflow and PR ID so different PRs and validation
# gates do not cancel one another (and push/manual runs use their ref).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  official-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/install-nix-action@v31
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/acp-sdk-client
      - name: Build the packaged Phenix ACP host
        run: nix build .#phenix-basic-acp -L --out-link result-acp
      - name: Exercise host through official stable-v1 SDK
        timeout-minutes: 3
        env:
          RUST_BACKTRACE: "1"
        run: |
          set -euo pipefail
          export PHENIX_BASIC_SQLITE_PATH="$RUNNER_TEMP/phenix-p1-official-acp.db"
          cargo run --locked --manifest-path tests/acp-sdk-client/Cargo.toml --release -- \
            "$PWD/result-acp/bin/phenix-basic-acp"
      - name: Require bounded SDK stdio input
        timeout-minutes: 2
        env:
          PHENIX_BASIC_USE_ACP_SDK: "1"
        run: |
          python tests/acp-sdk-frame-bounds.py "$PWD/result-acp/bin/phenix-basic-acp"
      - name: Record SDK dependency resolution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-acp-sdk-lock-${{ github.sha }}
          path: tests/acp-sdk-client/Cargo.lock
          if-no-files-found: ignore
