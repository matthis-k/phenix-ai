# Candidate only. The existing minimal-kernel.yml remains the shipping gate.
# All execution, caching, sharding and evidence logic lives in phenix-flake-ci.
# This immutable library revision batches each shard into one Nix DAG build
# and restores the compatible trusted-main Nix closure read-only;
# it retains the complete exact-head inventory and credential-free PR boundary.
name: Minimal kernel flake-aware matrix candidate
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only the newest source commit needs PR evidence. Manual and push runs
# retain independent identities and are never cancelled by a PR update.
concurrency:
  group: p1-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  candidate:
    uses: matthis-k/phenix-flake-ci/.github/workflows/flake-checks.yml@430d2abd51bf13110c8b26852a4f5f8ca347756c
    with:
      config: ci/flake-check-config.nix
      library_ref: 430d2abd51bf13110c8b26852a4f5f8ca347756c
