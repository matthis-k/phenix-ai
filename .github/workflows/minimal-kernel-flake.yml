# Candidate only. The existing minimal-kernel.yml remains the shipping gate.
# All execution, caching and evidence logic lives in phenix-flake-ci.
# The exact-head check inventory runs as one deduplicated native Nix DAG.
# Retain read-only trusted-main cache restore, credential-free PR authority,
# all product/security checks and fail-closed exact-head evidence verification.
name: Minimal kernel flake-aware matrix candidate
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only the newest source commit needs PR evidence. Manual and push runs
# retain independent identities and are never cancelled by a PR update.
concurrency:
  group: p1-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  candidate:
    uses: matthis-k/phenix-flake-ci/.github/workflows/flake-local-dag.yml@1f0ddeeb032c2092d8bdf0d01ad31061cf21c21a
    with:
      config: ci/flake-check-config.nix
      library_ref: 1f0ddeeb032c2092d8bdf0d01ad31061cf21c21a
