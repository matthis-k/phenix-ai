name: "Minimal kernel flake-aware matrix candidate"
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  flake-checks:
    if: ${{ github.event_name == 'pull_request' && !(github.repository == 'matthis-k/phenix-ai' && github.event.pull_request.head.repo.full_name == 'matthis-k/phenix-ai' && (github.event.pull_request.user.login == 'matthis-k')) }}
    uses: matthis-k/phenix-flake-ci/.github/workflows/flake-dag-staged.yml@e83c6029afc0140a242ae8240dbff6efe5979725
    with:
      config: "ci/flake-check-config.nix"
      library_ref: "e83c6029afc0140a242ae8240dbff6efe5979725"
