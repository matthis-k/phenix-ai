name: "Phenix generated Nix CI (4 remote builders)"
on:
  push:
    branches:
      - "main"
      - "ci/usage-first-paired-workflows-20261028"

permissions:
  contents: read
  id-token: write

jobs:
  flake-checks:
    if: ${{ github.repository == 'matthis-k/phenix-ai' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ci/usage-first-paired-workflows-20261028') }}
    uses: matthis-k/phenix-flake-ci/.github/workflows/flake-nix-builders.yml@29292dde595a11d6636c87bc5121c861cb1e1b0f
    with:
      config: "ci/flake-check-config.nix"
      library_ref: "29292dde595a11d6636c87bc5121c861cb1e1b0f"
      worker_count: 4
      slots_per_worker: 2
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID || vars.TS_OAUTH_CLIENT_ID }}
      TS_AUDIENCE: ${{ format('api.tailscale.com/{0}', secrets.TS_OAUTH_CLIENT_ID || vars.TS_OAUTH_CLIENT_ID) }}
