name: "Phenix generated Nix CI (4 remote builders)"
on:
  push:
    branches:
      - "ci/m1-generated-backend-consumer"
      - "ci/m1-p1-ci-cutover"
      - "ci/m1-p1-cache-benchmark"
      - "main"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  flake-checks:
    uses: matthis-k/phenix-flake-ci/.github/workflows/flake-nix-builders.yml@a1480620950508215bdda4a5404f046becf65cf8
    with:
      config: "ci/flake-check-config.nix"
      library_ref: "a1480620950508215bdda4a5404f046becf65cf8"
      worker_count: 4
      slots_per_worker: 2
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID || vars.TS_OAUTH_CLIENT_ID }}
      TS_AUDIENCE: ${{ format('api.tailscale.com/{0}', secrets.TS_OAUTH_CLIENT_ID || vars.TS_OAUTH_CLIENT_ID) }}
