name: Prototype graph (Rust-only)
on:
  push:
    branches: ["prototype-graph/**"]
  pull_request:

permissions:
  contents: write

jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Bootstrap rustfmt on isolated prototype branch (temporary formatting)
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style(graph): format standalone prototype"
            git push origin HEAD:refs/heads/prototype-graph/iteration-17
          fi
      - name: Rust scope, cutover, and graph tests
        run: cargo run -p xtask -- verify
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
