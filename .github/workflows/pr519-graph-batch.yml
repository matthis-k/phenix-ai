name: PR 519 component graph batch

on:
  push:
    branches:
      - refactor/shared-graph-mechanics

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          ref: refactor/shared-graph-mechanics

      - name: Apply component graph migration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('rust/crates/phenix-core/src/component.rs')
          text = path.read_text()

          old_import = "use crate::{\n    Authority,"
          new_import = "use crate::{\n    graph_util::DirectedGraph, Authority,"
          if text.count(old_import) != 1:
              raise SystemExit('unexpected component import shape')
          text = text.replace(old_import, new_import, 1)

          start = text.index('fn validate_required_import_dag(')
          end = text.index('\nfn validate_component_manifest', start)
          replacement = '''fn validate_required_import_dag(
              components: &BTreeMap<ComponentId, ResolvedComponent>,
          ) -> Result<(), ComponentGraphError> {
              let mut graph = DirectedGraph::from_nodes(components.keys().cloned());
              for (component, resolved) in components {
                  for import in &resolved.imports {
                      if !import.required {
                          continue;
                      }
                      if let Some(binding) = &import.binding {
                          graph.add_edge(component, binding.exporter());
                      }
                      for fallback in &import.fallbacks {
                          graph.add_edge(component, fallback.exporter());
                      }
                  }
              }

              for component in components.keys() {
                  if let Some(path) = graph.cycle_path_from(component) {
                      return Err(ComponentGraphError::RequiredImportCycle { path });
                  }
              }
              Ok(())
          }
          '''
          text = text[:start] + replacement + text[end:]

          test_start = text.index('    #[test]\n    fn required_import_cycles_report_the_concrete_component_path()')
          test_end = text.index('\n    #[test]\n    fn component_owner_is_a_real_plugin_trust_boundary()', test_start)
          test_replacement = '''    #[test]
              fn required_import_cycles_report_the_concrete_component_path() {
                  let authority = Authority::default();
                  let interface_a = interface("phenix.a@1");
                  let interface_b = interface("phenix.b@1");
                  let component_a = ComponentManifest {
                      listeners: Vec::new(),
                      id: component("component-a"),
                      owner: plugin("plugin-a"),
                      imports: vec![ComponentImport {
                          interface: interface_b.clone(),
                          schema: Default::default(),
                          required: true,
                          authority: authority.clone(),
                      }],
                      exports: vec![ComponentExport {
                          interface: interface_a.clone(),
                          schema: Default::default(),
                          priority: 0,
                          required_authority: authority.clone(),
                      }],
                      maximum_authority: authority.clone(),
                  };
                  let component_b = ComponentManifest {
                      listeners: Vec::new(),
                      id: component("component-b"),
                      owner: plugin("plugin-b"),
                      imports: vec![ComponentImport {
                          interface: interface_a,
                          schema: Default::default(),
                          required: true,
                          authority: authority.clone(),
                      }],
                      exports: vec![ComponentExport {
                          interface: interface_b,
                          schema: Default::default(),
                          priority: 0,
                          required_authority: authority.clone(),
                      }],
                      maximum_authority: authority.clone(),
                  };
                  let plugin_a = plugin_manifest("plugin-a", authority.clone());
                  let plugin_b = plugin_manifest("plugin-b", authority.clone());
                  let expected = ComponentGraphError::RequiredImportCycle {
                      path: vec![
                          component("component-a"),
                          component("component-b"),
                          component("component-a"),
                      ],
                  };

                  for (plugins, components) in [
                      (
                          vec![plugin_a.clone(), plugin_b.clone()],
                          vec![component_a.clone(), component_b.clone()],
                      ),
                      (
                          vec![plugin_b.clone(), plugin_a.clone()],
                          vec![component_b.clone(), component_a.clone()],
                      ),
                  ] {
                      let error = ResolvedComponentGraph::compile(plugins, components, &authority)
                          .unwrap_err();
                      assert_eq!(error, expected);
                      assert_eq!(
                          error.to_string(),
                          "required component import cycle: component-a -> component-b -> component-a"
                      );
                  }
              }
          '''
          text = text[:test_start] + test_replacement + text[test_end:]
          path.write_text(text)
          PY

      - name: Refresh excluded SDK fixture lock
        run: cargo generate-lockfile --manifest-path rust/crates/phenix-sdk/tests/fixtures/external-consumer/Cargo.toml

      - name: Format
        run: cargo fmt --manifest-path rust/Cargo.toml --all

      - name: Focused component regression
        run: cargo test --manifest-path rust/Cargo.toml -p phenix-core --lib required_import_cycles_report_the_concrete_component_path

      - name: Commit batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/crates/phenix-core/src/component.rs rust/crates/phenix-sdk/tests/fixtures/external-consumer/Cargo.lock
          git diff --cached --check
          git commit -m 'refactor(core): migrate component dependency validation'
          git push origin HEAD:refactor/shared-graph-mechanics
