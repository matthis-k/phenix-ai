name: "FBP H5 Scoped Closure Paired Benchmark"
on:
  pull_request:
    paths:
      - "packages/phenix-graphs/examples/fbp_closure_benchmark.rs"
      - "packages/phenix-graphs/src/runtime/closure.rs"
      - "packages/phenix-graphs/src/runtime/readiness.rs"
      - "packages/phenix-graphs/src/runtime/request.rs"
      - "packages/phenix-graphs/src/runtime/mod.rs"
      - ".github/workflows/fbp-h5-closure-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-h5-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
      - name: Checkout exact pre-witness baseline (#1279)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 3dbf8e540400cb678f6ca8fe7ee16b94139baeca
          path: baseline
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - name: Machine and exact source provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            echo "candidate_source=$(git -C candidate rev-parse HEAD)"
            echo "baseline_source=$(git -C baseline rev-parse HEAD)"
            echo "workflow_source=$GITHUB_SHA"
            echo "utc=$(date -u +%FT%TZ)"
            uname -a
            lscpu | grep -E '^(Architecture|CPU\(s\)|Model name|CPU max MHz|CPU min MHz):' || true
            nix --version
            (cd candidate && nix develop --command rustc -vV)
            (cd baseline && nix develop --command rustc -vV)
          } > artifacts/environment.txt
          cat artifacts/environment.txt
      - name: Compile byte-identical closure workload on both implementations
        shell: bash
        run: |
          set -euo pipefail
          cp candidate/packages/phenix-graphs/examples/fbp_closure_benchmark.rs \
            baseline/packages/phenix-graphs/examples/fbp_closure_benchmark.rs
          sha256sum candidate/packages/phenix-graphs/examples/fbp_closure_benchmark.rs \
            baseline/packages/phenix-graphs/examples/fbp_closure_benchmark.rs \
            > artifacts/benchmark-source-sha256.txt
          cat artifacts/benchmark-source-sha256.txt
          for variant in baseline candidate; do
            (cd "$variant" && nix develop --command cargo build --locked --release -q -p phenix-graph \
              --example fbp_closure_benchmark --example fbp_benchmark)
          done
      - name: Three interleaved closure and sparse-scheduler repetitions
        shell: bash
        run: |
          set -euo pipefail
          for repetition in 1 2 3; do
            if (( repetition % 2 == 1 )); then
              order=(baseline candidate)
            else
              order=(candidate baseline)
            fi
            for variant in "${order[@]}"; do
              (cd "$variant" && ./target/release/examples/fbp_closure_benchmark \
                160 0 16 64 128) > "artifacts/${variant}-closure-${repetition}.csv"
              (cd "$variant" && ./target/release/examples/fbp_benchmark \
                3000 1 16 64 256) > "artifacts/${variant}-sparse-${repetition}.csv"
              echo "variant=${variant} repetition=${repetition}"
              cat "artifacts/${variant}-closure-${repetition}.csv"
              cat "artifacts/${variant}-sparse-${repetition}.csv"
            done
          done
      - name: Preserve all raw timing and environment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fbp-h5-closure-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/
          if-no-files-found: warn
