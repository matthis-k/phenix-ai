# Temporary artifact generation; remove before merging this PR.
name: Regenerate CI impact package workflow

on:
  pull_request:

permissions:
  contents: read

jobs:
  regeneration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: Resolve locked dependency and emit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          nix flake lock
          nix shell --impure \
            --expr '(builtins.getFlake (toString ./.)).inputs.nixpkgs.legacyPackages.x86_64-linux.nixfmt' \
            --command nixfmt modules/development.nix
          nix eval --raw \
            .#packages.x86_64-linux.phenix-maintenance.phenixMaintenance.ci.github.workflow \
            > "$RUNNER_TEMP/generated-ci.yml"
          printf '%s\n' BEGIN_CI_LOCK
          cat flake.lock
          printf '%s\n' END_CI_LOCK
          printf '%s\n' BEGIN_CI_WORKFLOW
          cat "$RUNNER_TEMP/generated-ci.yml"
          printf '%s\n' END_CI_WORKFLOW
          printf '%s\n' BEGIN_NIXFMT_DIFF
          git diff -- modules/development.nix
          printf '%s\n' END_NIXFMT_DIFF
