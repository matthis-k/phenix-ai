name: "FBP H6 Static Readiness Validation Paired Benchmark"
on:
  pull_request:
    paths:
      - "packages/phenix-graphs/src/runtime/readiness.rs"
      - "packages/phenix-graphs/tests/fbp_streams.rs"
      - "packages/phenix-graphs/examples/fbp_agent_mixed_benchmark.rs"
      - "docs/fbp-h6-static-readiness-validation-20261113.md"
      - ".github/workflows/fbp-h6-static-readiness-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
      - name: Checkout exact H6 allocation baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 89e48b896e9687ffbb8bb92abde621d7bbd74d97
          path: baseline
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - name: Record exact source and machine provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for example in fbp_agent_mixed_benchmark fbp_agent_allocation_benchmark fbp_targeted_eos_benchmark fbp_closure_benchmark; do
            cp "candidate/packages/phenix-graphs/examples/$example.rs" \
              "baseline/packages/phenix-graphs/examples/$example.rs"
            cmp "candidate/packages/phenix-graphs/examples/$example.rs" \
              "baseline/packages/phenix-graphs/examples/$example.rs"
            sha256sum "candidate/packages/phenix-graphs/examples/$example.rs" \
              "baseline/packages/phenix-graphs/examples/$example.rs"
          done > artifacts/source-hashes.txt
          {
            echo "baseline=$(git -C baseline rev-parse HEAD)"
            echo "candidate=$(git -C candidate rev-parse HEAD)"
            echo "workflow_sha=$GITHUB_SHA"
            date -u +%FT%TZ
            uname -a
            lscpu | grep -E '^(Architecture|CPU\(s\)|Model name|CPU max MHz|CPU min MHz):' || true
            taskset -pc $$
            cat /sys/fs/cgroup/cpu.max 2>/dev/null || true
            nix --version
            (cd baseline && nix develop --command rustc -vV)
          } > artifacts/environment.txt
          cat artifacts/environment.txt
          cat artifacts/source-hashes.txt
      - name: Compile identical release workloads against each runtime
        shell: bash
        run: |
          set -euo pipefail
          for variant in baseline candidate; do
            (cd "$variant" && nix develop --command cargo build --locked --release -q \
              -p phenix-graph \
              --example fbp_agent_mixed_benchmark \
              --example fbp_agent_allocation_benchmark \
              --example fbp_targeted_eos_benchmark \
              --example fbp_closure_benchmark)
          done
      - name: Seven interleaved CPU-pinned paired comparisons
        shell: bash
        run: |
          set -euo pipefail
          allowed="$(taskset -pc $$ | sed -E 's/.*: //')"
          cpu="$(printf '%s' "$allowed" | cut -d, -f1 | cut -d- -f1)"
          taskset -c "$cpu" true
          echo "cpu=$cpu" > artifacts/affinity.txt
          for repetition in 1 2 3 4 5 6 7; do
            if (( repetition % 2 == 1 )); then
              order=(baseline candidate)
            else
              order=(candidate baseline)
            fi
            for variant in "${order[@]}"; do
              for mode in polled notified; do
                taskset -c "$cpu" /usr/bin/time \
                  -f 'elapsed_s=%e user_s=%U sys_s=%S maxrss_kb=%M' \
                  -o "artifacts/$variant-$mode-$repetition.resources" \
                  "$variant/target/release/examples/fbp_agent_mixed_benchmark" "$mode" 400 \
                  > "artifacts/$variant-$mode-$repetition.csv"
              done
              taskset -c "$cpu" /usr/bin/time \
                -f 'elapsed_s=%e user_s=%U sys_s=%S maxrss_kb=%M' \
                -o "artifacts/$variant-eos-$repetition.resources" \
                "$variant/target/release/examples/fbp_targeted_eos_benchmark" \
                > "artifacts/$variant-eos-$repetition.csv"
              taskset -c "$cpu" /usr/bin/time \
                -f 'elapsed_s=%e user_s=%U sys_s=%S maxrss_kb=%M' \
                -o "artifacts/$variant-closure-$repetition.resources" \
                "$variant/target/release/examples/fbp_closure_benchmark" 80 16 64 128 \
                > "artifacts/$variant-closure-$repetition.csv"
              if (( repetition <= 3 )); then
                for mode in polled notified; do
                  taskset -c "$cpu" "$variant/target/release/examples/fbp_agent_allocation_benchmark" "$mode" 200 \
                    > "artifacts/$variant-alloc-$mode-$repetition.csv"
                done
              fi
              echo "variant=$variant repetition=$repetition"
              cat "artifacts/$variant-notified-$repetition.csv"
              cat "artifacts/$variant-polled-$repetition.csv"
              cat "artifacts/$variant-eos-$repetition.csv"
              cat "artifacts/$variant-closure-$repetition.csv"
            done
          done
      - name: Summarize allocation deltas and paired timing medians
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee artifacts/summary.txt
          import csv, statistics as stats
          from pathlib import Path
          def rows(path):
              with open(path, newline="") as fh:
                  return list(csv.DictReader(fh))
          print("ALLOCATIONS per turn baseline -> candidate (3 identical-program paired samples)")
          for mode in ("polled", "notified"):
              for idle in ("0", "16", "64", "128"):
                  for route in ("local_total", "remote_total"):
                      vals = []
                      for variant in ("baseline", "candidate"):
                          per_rep = [
                              float(next(r["alloc_calls_per_sample"] for r in rows(
                                  f"artifacts/{variant}-alloc-{mode}-{rep}.csv"
                              ) if r["idle_nodes"] == idle and r["phase"] == route))
                              for rep in (1, 2, 3)
                          ]
                          vals.append(stats.median(per_rep))
                      print(f"{mode:8} idle={idle:3} {route:12} {vals[0]:.1f} -> {vals[1]:.1f} ({vals[1]-vals[0]:+.1f})")
          print("AGENT MEAN ns/turn median of seven paired runs (lower better)")
          for mode in ("polled", "notified"):
              for idle in ("0", "16", "64", "128"):
                  vals = []
                  for variant in ("baseline", "candidate"):
                      per_rep = [
                          float(next(r["mean_ns_per_turn"] for r in rows(
                              f"artifacts/{variant}-{mode}-{rep}.csv"
                          ) if r["idle_nodes"] == idle))
                          for rep in range(1, 8)
                      ]
                      vals.append(stats.median(per_rep))
                  print(f"{mode:8} idle={idle:3} {vals[0]:8.1f} -> {vals[1]:8.1f} ({(vals[1]/vals[0]-1)*100:+.1f}%)")
          print("EOS/closure CSV are preserved for review.")
          PY
      - name: Save all source, performance and RSS evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fbp-h6-static-readiness-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/
          if-no-files-found: warn
