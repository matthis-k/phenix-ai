name: "FBP Q2 Paired Same-Runner A/B"
on:
  pull_request:
    paths:
      - ".github/workflows/fbp-q2-paired-ab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-q2:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - name: Measure identical benchmark source against both code revisions
        shell: bash
        env:
          CONTROL: 6a95145b7a5f79823d00372830279a4c98fcca3a
          OPTIMIZED: b27648feaf3444e1eefd522f7e365f024d17f146
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git fetch --no-tags origin "$CONTROL" "$OPTIMIZED"
          BENCH="packages/phenix-graphs/benches/q2_unchanged.rs"
          test "$(git rev-parse "$CONTROL:$BENCH")" = "$(git rev-parse "$OPTIMIZED:$BENCH")"
          test "$(git rev-parse "$CONTROL:packages/phenix-graphs/Cargo.toml")" = "$(git rev-parse "$OPTIMIZED:packages/phenix-graphs/Cargo.toml")"
          {
            echo "control=$CONTROL"
            echo "optimized=$OPTIMIZED"
            echo "benchmark_blob=$(git rev-parse "$CONTROL:$BENCH")"
            date -u +%FT%TZ
            lscpu | grep -E '^(Architecture|CPU\\(s\\)|Model name|CPU max MHz|CPU min MHz):' || true
            nix --version
          } | tee artifacts/environment.txt
          for repetition in 1 2 3; do
            if (( repetition % 2 == 1 )); then
              order="control optimized"
            else
              order="optimized control"
            fi
            for variant in $order; do
              if [ "$variant" = "control" ]; then sha="$CONTROL"; else sha="$OPTIMIZED"; fi
              git -c advice.detachedHead=false checkout --force "$sha"
              test "$(git rev-parse HEAD)" = "$sha"
              echo "=== run=$repetition variant=$variant source=$sha ==="
              nix develop --command cargo bench --locked -q -p phenix-graph --bench q2_unchanged | tee "artifacts/${variant}-${repetition}.txt"
            done
          done
      - name: Preserve all raw samples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: q2-paired-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/
          if-no-files-found: error
