# Isolated performance probe of the exact-head Phenix CI native Nix DAG.
# Cold has a unique Actions cache key; warm restores only that cold cache.
# The ordinary required Flake CI workflow and its pinned dependency are unchanged.
name: Phenix Flake CI cold/warm benchmark

on:
  push:
    branches:
      - bench/flake-ci-cold-warm-20261108
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flake-benchmark-${{ github.ref }}
  cancel-in-progress: true

env:
  BENCH_CACHE_KEY: phenix-ci-bench-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}

jobs:
  cold:
    name: cold
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: matthis-k/phenix-flake-ci
          ref: 94f8e8b23027f3178c573b42b59ca1991b81fb8e
          path: .ci-tools/flake-ci
          persist-credentials: false
      - name: Regression-test benchmark's fail-closed evidence
        run: python3 ci/test-benchmark-flake-ci.py -v
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate exact-head full check inventory and native Nix DAG
        run: |
          set -euo pipefail
          mkdir -p benchmark
          nix eval --json --file ci/flake-check-config.nix > benchmark/config.json
          python3 .ci-tools/flake-ci/lib/flake-check-plan.py plan \
            --config benchmark/config.json --output benchmark/plan.json
          python3 .ci-tools/flake-ci/lib/flake-check-dag.py analyze \
            --plan benchmark/plan.json --output benchmark/graph.json
      - name: Start with a unique cold project cache and save for warm
        id: nix_cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: ${{ env.BENCH_CACHE_KEY }}
          gc-max-store-size-linux: "8G"
      - name: Prove the cold cache key was not previously present
        env:
          CACHE_HIT: ${{ steps.nix_cache.outputs.hit-primary-key }}
        run: test "$CACHE_HIT" = false
      - name: Time full native Nix DAG (cold project cache)
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          set +e
          python3 .ci-tools/flake-ci/lib/flake-check-dag.py build \
            --plan benchmark/plan.json --graph benchmark/graph.json \
            --output benchmark/evidence.json 2>&1 | tee benchmark/build.log
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$(($(date +%s) - start))" > benchmark/build-seconds.txt
          exit "$status"
      - name: Verify complete exact-head outputs and protect GC roots
        run: |
          set -euo pipefail
          python3 .ci-tools/flake-ci/lib/flake-check-dag.py verify \
            --plan benchmark/plan.json --graph benchmark/graph.json \
            --evidence benchmark/evidence.json
          python3 .ci-tools/flake-ci/lib/flake-check-dag.py pin \
            --plan benchmark/plan.json --graph benchmark/graph.json \
            --evidence benchmark/evidence.json \
            --directory "${RUNNER_TEMP}/phenix-ci-bench-verified-roots"
      - name: Capture exact derivation events and complete Nix output closure
        env:
          BENCH_CACHE_HIT: ${{ steps.nix_cache.outputs.hit-primary-key }}
        run: |
          set -euo pipefail
          python3 .ci-tools/flake-ci/lib/shard-build-report.py \
            --allow-zero-builds --shard 00=benchmark/build.log \
            > benchmark/build-events.json
          python3 ci/benchmark-flake-ci.py capture \
            --phase cold --directory benchmark --library-ref 94f8e8b23027f3178c573b42b59ca1991b81fb8e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: phenix-ci-bench-cold
          path: benchmark/
          if-no-files-found: warn

  warm:
    name: warm
    needs: cold
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: matthis-k/phenix-flake-ci
          ref: 94f8e8b23027f3178c573b42b59ca1991b81fb8e
          path: .ci-tools/flake-ci
          persist-credentials: false
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: phenix-ci-bench-cold
          path: reference/cold
      - name: Re-evaluate the identical exact-head check graph
        run: |
          set -euo pipefail
          mkdir -p benchmark
          nix eval --json --file ci/flake-check-config.nix > benchmark/config.json
          python3 .ci-tools/flake-ci/lib/flake-check-plan.py plan \
            --config benchmark/config.json --output benchmark/plan.json
          python3 .ci-tools/flake-ci/lib/flake-check-dag.py analyze \
            --plan benchmark/plan.json --output benchmark/graph.json
          cmp benchmark/plan.json reference/cold/plan.json
          cmp benchmark/graph.json reference/cold/graph.json
      - name: Restore only the exact cold-run Nix cache (no publication)
        id: nix_cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: ${{ env.BENCH_CACHE_KEY }}
          save: false
      - name: Prove exact primary-key hit before measuring retention
        env:
          CACHE_HIT: ${{ steps.nix_cache.outputs.hit-primary-key }}
        run: test "$CACHE_HIT" = true
      - name: Prove offline retention of all cold Nix closure paths before building
        run: |
          python3 ci/benchmark-flake-ci.py retention \
            --cold-closure reference/cold/closure.json \
            --output benchmark/retention.json
      - name: Time full native Nix DAG (warm project cache)
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          set +e
          python3 .ci-tools/flake-ci/lib/flake-check-dag.py build \
            --plan benchmark/plan.json --graph benchmark/graph.json \
            --output benchmark/evidence.json 2>&1 | tee benchmark/build.log
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$(($(date +%s) - start))" > benchmark/build-seconds.txt
          exit "$status"
      - name: Verify and capture warm native Nix evidence
        env:
          BENCH_CACHE_HIT: ${{ steps.nix_cache.outputs.hit-primary-key }}
        run: |
          set -euo pipefail
          python3 .ci-tools/flake-ci/lib/flake-check-dag.py verify \
            --plan benchmark/plan.json --graph benchmark/graph.json \
            --evidence benchmark/evidence.json
          python3 .ci-tools/flake-ci/lib/shard-build-report.py \
            --allow-zero-builds --shard 00=benchmark/build.log \
            > benchmark/build-events.json
          python3 ci/benchmark-flake-ci.py capture \
            --phase warm --directory benchmark --library-ref 94f8e8b23027f3178c573b42b59ca1991b81fb8e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: phenix-ci-bench-warm
          path: benchmark/
          if-no-files-found: warn

  report:
    name: compare
    needs: [cold, warm]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require both complete benchmark phases
        env:
          COLD: ${{ needs.cold.result }}
          WARM: ${{ needs.warm.result }}
        run: |
          test "$COLD" = success
          test "$WARM" = success
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: phenix-ci-bench-cold
          path: comparison/cold
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: phenix-ci-bench-warm
          path: comparison/warm
      - name: Record actual GitHub job elapsed times and critical path
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" > comparison/jobs.json
          set +e
          python3 ci/benchmark-flake-ci.py compare \
            --cold comparison/cold --warm comparison/warm \
            --jobs comparison/jobs.json \
            --json comparison/report.json --markdown comparison/report.md
          status=$?
          set -e
          if test -f comparison/report.md; then
            cat comparison/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: phenix-ci-bench-compare
          path: comparison/
          if-no-files-found: warn
