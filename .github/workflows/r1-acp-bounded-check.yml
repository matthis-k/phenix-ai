name: Temporary ACP bounded transport check
on:
  push:
    branches: [impl/m1-r1-acp-sdk-host-v1]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and compile bounded SDK transport
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          echo PHENIX_SDK_FORMAT_BEGIN
          base64 -w0 crates/phenix-basic-runtime/src/acp_sdk.rs | fold -w 200 | sed 's/^/PHENIX_SDK_FORMAT_LINE:/'
          echo PHENIX_SDK_FORMAT_END
          cargo check --locked -p phenix-basic-runtime
