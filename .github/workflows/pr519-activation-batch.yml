name: PR 519 activation graph batch

on:
  push:
    branches:
      - refactor/shared-graph-mechanics

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          ref: refactor/shared-graph-mechanics

      - name: Apply activation graph migration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('rust/crates/phenix-core/src/registry.rs')
          text = path.read_text()

          old_import = '''use crate::{
              ArtifactRevision, Authority, ComponentGraphError, ComponentId, EventError, PluginExecution,
              PluginId, PluginManifest, ResourceNamespace, RuntimeId, ServiceId, ServiceRole,
          };'''
          new_import = '''use crate::{
              graph_util::DirectedGraph, ArtifactRevision, Authority, ComponentGraphError, ComponentId,
              EventError, PluginExecution, PluginId, PluginManifest, ResourceNamespace, RuntimeId,
              ServiceId, ServiceRole,
          };'''
          if old_import not in text:
              raise SystemExit('unexpected registry import shape')
          text = text.replace(old_import, new_import, 1)

          start = text.index('fn dependency_order(')
          end = text.index('\n#[cfg(test)]\nmod tests', start)
          replacement = '''fn dependency_order(
              manifests: &BTreeMap<PluginId, PluginManifest>,
              runtime_bindings: &BTreeMap<PluginId, RuntimeBinding>,
          ) -> Result<Vec<PluginId>, KernelError> {
              let mut graph = DirectedGraph::from_nodes(manifests.keys().cloned());
              for manifest in manifests.values() {
                  for dependency in &manifest.dependencies {
                      if !manifests.contains_key(dependency) {
                          return Err(KernelError::UnknownDependency {
                              plugin: manifest.id.clone(),
                              dependency: dependency.clone(),
                          });
                      }
                      graph.add_edge(&manifest.id, dependency);
                  }
                  if let Some(binding) = runtime_bindings.get(&manifest.id) {
                      graph.add_edge(&manifest.id, &binding.provider);
                  }
              }

              for plugin in manifests.keys() {
                  if let Some(path) = graph.cycle_path_from(plugin) {
                      return Err(KernelError::DependencyCycle(
                          path.first()
                              .cloned()
                              .expect("cycle path contains its repeated root"),
                      ));
                  }
              }

              fn append_activation_order(
                  plugin: &PluginId,
                  manifests: &BTreeMap<PluginId, PluginManifest>,
                  runtime_bindings: &BTreeMap<PluginId, RuntimeBinding>,
                  visited: &mut BTreeSet<PluginId>,
                  order: &mut Vec<PluginId>,
              ) {
                  if !visited.insert(plugin.clone()) {
                      return;
                  }
                  for dependency in &manifests[plugin].dependencies {
                      append_activation_order(
                          dependency,
                          manifests,
                          runtime_bindings,
                          visited,
                          order,
                      );
                  }
                  if let Some(binding) = runtime_bindings.get(plugin) {
                      append_activation_order(
                          &binding.provider,
                          manifests,
                          runtime_bindings,
                          visited,
                          order,
                      );
                  }
                  order.push(plugin.clone());
              }

              let mut visited = BTreeSet::new();
              let mut order = Vec::new();
              for plugin in manifests.keys() {
                  append_activation_order(
                      plugin,
                      manifests,
                      runtime_bindings,
                      &mut visited,
                      &mut order,
                  );
              }
              Ok(order)
          }
          '''
          text = text[:start] + replacement + text[end:]

          old_test = '''    #[test]
              fn dependencies_are_order_independent_and_cycles_fail() {
                  let mut a = PluginManifest::resource_only(plugin("a"));
                  a.dependencies.push(plugin("b"));
                  let b = PluginManifest::resource_only(plugin("b"));
                  let config = KernelConfig::new([a.clone(), b]).unwrap();
                  assert_eq!(config.activation_order(), &[plugin("b"), plugin("a")]);

                  let mut b = PluginManifest::resource_only(plugin("b"));
                  b.dependencies.push(plugin("a"));
                  assert!(matches!(
                      KernelConfig::new([a, b]),
                      Err(KernelError::DependencyCycle(_))
                  ));
              }
          '''
          new_test = '''    #[test]
              fn dependencies_are_order_independent_and_cycles_fail() {
                  let mut a = PluginManifest::resource_only(plugin("a"));
                  a.dependencies.push(plugin("b"));
                  let b = PluginManifest::resource_only(plugin("b"));

                  for manifests in [
                      vec![a.clone(), b.clone()],
                      vec![b.clone(), a.clone()],
                  ] {
                      let config = KernelConfig::new(manifests).unwrap();
                      assert_eq!(config.activation_order(), &[plugin("b"), plugin("a")]);
                  }

                  let mut cyclic_b = b;
                  cyclic_b.dependencies.push(plugin("a"));
                  for manifests in [
                      vec![a.clone(), cyclic_b.clone()],
                      vec![cyclic_b.clone(), a.clone()],
                  ] {
                      assert!(matches!(
                          KernelConfig::new(manifests),
                          Err(KernelError::DependencyCycle(_))
                      ));
                  }
              }
          '''
          if old_test not in text:
              raise SystemExit('unexpected dependency regression shape')
          text = text.replace(old_test, new_test, 1)
          path.write_text(text)
          PY

      - name: Format
        run: cargo fmt --manifest-path rust/Cargo.toml --all

      - name: Focused activation regressions
        run: |
          cargo test --manifest-path rust/Cargo.toml -p phenix-core --lib dependencies_are_order_independent_and_cycles_fail
          cargo test --manifest-path rust/Cargo.toml -p phenix-core --lib runtime_provider

      - name: Commit batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/crates/phenix-core/src/registry.rs
          git diff --cached --check
          git commit -m 'refactor(core): migrate activation cycle validation'
          git push origin HEAD:refactor/shared-graph-mechanics
