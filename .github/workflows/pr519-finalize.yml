name: PR 519 final implementation cleanup

on:
  push:
    branches:
      - refactor/shared-graph-mechanics

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          ref: refactor/shared-graph-mechanics

      - name: Apply final implementation cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          execution = Path('rust/crates/phenix-plugin-execution/src/implementation.rs')
          text = execution.read_text()
          old = 'use std::collections::{BTreeMap, BTreeSet};'
          if text.count(old) != 1:
              raise SystemExit('unexpected execution collection import')
          text = text.replace(old, 'use std::collections::BTreeMap;', 1)
          marker = 'use std::{\n        fs,\n        path::PathBuf,'
          replacement = 'use std::{\n        collections::BTreeSet,\n        fs,\n        path::PathBuf,'
          if text.count(marker) != 1:
              raise SystemExit('unexpected execution test imports')
          execution.write_text(text.replace(marker, replacement, 1))

          topology = Path('rust/crates/phenix-core/src/runtime_topology_generation_regression.rs')
          text = topology.read_text()
          test_name = 'equivalent_registration_order_preserves_graph_generation_identity'
          if test_name not in text:
              text += dedent('''

              #[test]
              fn equivalent_registration_order_preserves_graph_generation_identity() {
                  let authority = Authority::default();
                  let plugin_a = plugin("fixture.registration-a", None);
                  let mut plugin_b = plugin("fixture.registration-b", None);
                  plugin_b.dependencies.push(plugin_a.id.clone());
                  let component_a = listener_component(&plugin_a.id, "fixture.registration-a", None);
                  let component_b = listener_component(&plugin_b.id, "fixture.registration-b", None);

                  let first = ResolvedHarness::resolve(
                      [plugin_a.clone(), plugin_b.clone()],
                      [component_a.clone(), component_b.clone()],
                      [],
                      &authority,
                  )
                  .unwrap();
                  let second = ResolvedHarness::resolve(
                      [plugin_b, plugin_a],
                      [component_b, component_a],
                      [],
                      &authority,
                  )
                  .unwrap();

                  assert_eq!(first.generation(), second.generation());
              }
              ''')
          topology.write_text(text)
          PY

      - name: Minimize excluded SDK fixture lock
        run: |
          fixture='rust/crates/phenix-sdk/tests/fixtures/external-consumer/Cargo.lock'
          git show origin/main:"$fixture" > "$fixture"
          cargo check --manifest-path rust/crates/phenix-sdk/tests/fixtures/external-consumer/Cargo.toml
          cargo check --manifest-path rust/crates/phenix-sdk/tests/fixtures/external-consumer/Cargo.toml --locked

      - name: Remove completed migration spec
        run: rm spec/followups/shared-graph-mechanics.md

      - name: Format and audit graph cleanup
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all
          if grep -R -n -E 'fn creates_cycle|fn reaches|collect_required_dependents|enum Visit|visiting: &mut' \
            rust/crates/phenix-core/src/component.rs \
            rust/crates/phenix-core/src/persistence_bootstrap.rs \
            rust/crates/phenix-core/src/reconciliation.rs \
            rust/crates/phenix-core/src/registry.rs \
            rust/crates/phenix-plugin-planning/src/implementation.rs \
            rust/crates/phenix-plugin-execution/src/implementation.rs; then
            echo 'replaceable generic graph traversal remains' >&2
            exit 1
          fi
          if grep -R -n -E 'pub use petgraph|pub .*petgraph::' rust/crates; then
            echo 'petgraph leaked through a public boundary' >&2
            exit 1
          fi

      - name: Focused semantic proof
        run: |
          cargo test --manifest-path rust/Cargo.toml -p phenix-core --lib equivalent_registration_order_preserves_graph_generation_identity
          cargo test --manifest-path rust/Cargo.toml -p phenix-core --lib required_import_cycles_report_the_concrete_component_path
          cargo test --manifest-path rust/Cargo.toml -p phenix-core --lib dependencies_are_order_independent_and_cycles_fail
          cargo test --manifest-path rust/Cargo.toml -p phenix-core --lib dependency_levels_are_registration_order_independent
          cargo test --manifest-path rust/Cargo.toml -p phenix-core --lib reconfiguring_a_provider_restarts_its_required_dependency_closure
          cargo test --manifest-path rust/Cargo.toml -p phenix-core --lib provider_dependency_cycle_is_rejected_before_store_open
          cargo test --manifest-path rust/Cargo.toml -p phenix-plugin-planning plan_cycle_validation_is_step_order_independent
          cargo test --manifest-path rust/Cargo.toml -p phenix-plugin-execution task_creation_rules_make_dependency_cycles_unrepresentable
          cargo test --manifest-path rust/Cargo.toml -p phenix-plugin-hooks hook_ready_order_is_lexical_independent_of_registration_order
          cargo test --manifest-path rust/Cargo.toml -p phenix-plugin-repository-workers dependency_selection_is_snapshot_order_independent

      - name: Compile workspace
        run: cargo check --manifest-path rust/Cargo.toml --workspace --locked

      - name: Measure hand-maintained Rust LOC delta
        run: |
          git diff --numstat origin/main -- rust/crates \
            | awk '$3 ~ /\.rs$/ && $3 !~ /tests\/fixtures\// { add += $1; del += $2 } END { printf "HAND_MAINTAINED_RUST_LOC added=%d deleted=%d net=%+d\n", add, del, add-del }'

      - name: Commit final implementation cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A rust spec/followups/shared-graph-mechanics.md
          git diff --cached --check
          git commit -m 'test(graph): close semantic identity and cleanup proofs'
          git push origin HEAD:refactor/shared-graph-mechanics
