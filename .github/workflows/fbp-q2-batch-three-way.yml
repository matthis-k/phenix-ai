name: "FBP Q2 Batch Root Rebase Three-Way Paired Benchmark"
on:
  pull_request:
    paths:
      - "packages/phenix-graphs/benches/q2_batch_isolated.rs"
      - "packages/phenix-graphs/Cargo.toml"
      - ".github/workflows/fbp-q2-batch-three-way.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-batch-three-way:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - name: Paired full compilation vs staged removal vs one-pass relocation
        env:
          FULL: b107436d7ddc89c46cf91dc770e188328e6947d0
          STAGED: dead3e77b24050f503bee74cb459b87f323230b6
          OPTIMIZED: 572eedbd1e7a1bc4271be12923125271741c6a68
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git fetch --no-tags origin "$FULL" "$STAGED" "$OPTIMIZED"
          BENCH="packages/phenix-graphs/benches/q2_batch_isolated.rs"
          MANIFEST="packages/phenix-graphs/Cargo.toml"
          for path in "$BENCH" "$MANIFEST"; do
            test "$(git rev-parse "$FULL:$path")" = "$(git rev-parse "$STAGED:$path")"
            test "$(git rev-parse "$FULL:$path")" = "$(git rev-parse "$OPTIMIZED:$path")"
          done
          {
            echo "full=$FULL"
            echo "staged=$STAGED"
            echo "optimized=$OPTIMIZED"
            echo "benchmark_blob=$(git rev-parse "$FULL:$BENCH")"
            echo "manifest_blob=$(git rev-parse "$FULL:$MANIFEST")"
            date -u +%FT%TZ
            lscpu | grep -E '^(Architecture|CPU\\(s\\)|Model name|CPU max MHz|CPU min MHz):' || true
            nix --version
          } | tee artifacts/environment.txt
          for repetition in 1 2 3; do
            case "$repetition" in
              1) order="full staged optimized" ;;
              2) order="staged optimized full" ;;
              3) order="optimized full staged" ;;
            esac
            for variant in $order; do
              case "$variant" in
                full) sha="$FULL" ;;
                staged) sha="$STAGED" ;;
                optimized) sha="$OPTIMIZED" ;;
              esac
              git -c advice.detachedHead=false checkout --force "$sha"
              test "$(git rev-parse HEAD)" = "$sha"
              echo "=== run=$repetition variant=$variant source=$sha ==="
              nix develop --command cargo bench --locked -q -p phenix-graph --bench q2_batch_isolated | tee "artifacts/${variant}-${repetition}.txt"
            done
          done
      - name: Preserve raw samples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: q2-batch-three-way-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/
          if-no-files-found: error
