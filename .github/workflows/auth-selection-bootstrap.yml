name: Auth selection bootstrap

on:
  push:
    branches: [feat/application-auth-model-routing]

permissions:
  contents: write

jobs:
  patch-and-check:
    if: ${{ !contains(github.event.head_commit.message, '[auth-stage2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/application-auth-model-routing
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 scripts/apply-auth-selection-patch.py
      - run: cargo fmt --manifest-path rust/Cargo.toml --all
      - name: Update Rust lock and compile changed packages
        run: cargo check --manifest-path rust/Cargo.toml -p phenix-provider-sdk -p phenix-plugin-providers -p phenix-harness -p phenix-binding-lua
      - name: Regenerate application descriptor
        run: |
          cargo run --manifest-path rust/Cargo.toml --locked -p phenix-application-interface --bin phenix-application-descriptor > share/phenix/interfaces/phenix.application@1.json
          cargo run --manifest-path rust/Cargo.toml --locked -p phenix-application-interface --bin phenix-application-descriptor -- --rust share/phenix/interfaces/phenix.application@1.json > rust/crates/phenix-application-interface/fixtures/application.rs
      - run: cargo test --manifest-path rust/Cargo.toml --locked -p phenix-provider-sdk -p phenix-plugin-providers -p phenix-application-interface --lib
      - run: git diff --check
      - name: Commit checked integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust share/phenix/interfaces/phenix.application@1.json
          git commit -m 'feat: expose OAuth auth through application facade [auth-stage2]'
          git push origin HEAD:feat/application-auth-model-routing
