name: Auth selection bootstrap

on:
  push:
    branches: [feat/application-auth-model-routing]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[auth-bootstrap]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/application-auth-model-routing
          fetch-depth: 0
      - run: python3 scripts/apply-auth-selection-patch.py
      - run: git diff --check
      - name: Commit patched integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust/crates/phenix-provider-sdk/src/oauth.rs \
                  rust/crates/phenix-sdk/src/contracts/step_runner.rs \
                  rust/crates/phenix-plugin-step-runner/src/lib.rs \
                  rust/crates/phenix-harness/src/application.rs \
                  rust/crates/phenix-application-interface/src/catalog.rs
          git commit -m 'feat: wire auth model routing runtime [auth-bootstrap]'
          git push origin HEAD:feat/application-auth-model-routing
