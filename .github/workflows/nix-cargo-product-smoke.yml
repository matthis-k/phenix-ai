name: Nix Cargo source product smoke

on:
  pull_request:

permissions:
  contents: read

jobs:
  product-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
      - name: Build and exercise the packaged harness from generic source closure
        shell: bash
        run: |
          set -euo pipefail
          nix build --no-link --print-build-logs \
            .#checks.x86_64-linux.phenix-product-runtime-smoke
