name: Temporary R1 ACP schema lock resolution
on:
  push:
    branches:
      - impl/m1-r1-acp-schema-frontend
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve exact workspace lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 > /dev/null
          echo PHENIX_SCHEMA_LOCK_BEGIN
          base64 -w0 Cargo.lock | fold -w 200 | sed 's/^/PHENIX_LOCK_LINE:/'
          echo PHENIX_SCHEMA_LOCK_END
