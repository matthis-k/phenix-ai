name: PR 504 lifecycle fix

on:
  push:
    branches: [spec/nvim-client-package]

concurrency:
  group: pr504-lifecycle-fix
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spec/nvim-client-package
      - name: Patch exact-head migration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              if s.count(old) != 1:
                  raise SystemExit(f'{label}: found {s.count(old)} anchors')
              p.write_text(s.replace(old, new, 1))

          once('rust/crates/phenix-plugin-step-runner/src/runner.rs',
               '''                    request: Box::new(ContextAdmissionRequest {\n                        execution_id: attribution.execution_id.clone(),\n                        step_plan: plan.clone(),\n                        candidates: context_candidates,\n                        cache_epoch,\n                    }),\n''',
               '''                    request: ContextAdmissionRequest {\n                        execution_id: attribution.execution_id.clone(),\n                        step_plan: plan.clone(),\n                        candidates: context_candidates,\n                        cache_epoch,\n                    },\n''', 'context admission')

          once('rust/crates/phenix-harness/src/runtime_config.rs',
               'use phenix_harness::{default_suite_authority, PhenixHarness};\n',
               'use crate::{default_suite_authority, PhenixHarness};\n', 'self import')

          once('rust/crates/phenix-harness/src/lib.rs',
               '    pub fn invoke(\n        &self,\n',
               '    pub fn invoke(\n        &mut self,\n', 'mutable invoke')

          once('rust/crates/phenix-harness/src/basic_suite.rs',
               '''                &SessionCommand::Create {\n                    id: SessionId::parse("root").unwrap(),\n                },\n''',
               '''                &SessionCommand::Create {\n                    session: phenix_plugin_catalog::SessionRecord::new(\n                        SessionId::parse("root").unwrap(),\n                    ),\n                },\n''', 'basic-suite session create')

          once('rust/crates/phenix-harness/src/lib.rs',
               '''        let create = serde_json::to_vec(&PhenixValue::from(&SessionCommand::Create {\n            id: SessionId::parse("session-1").unwrap(),\n        }))\n''',
               '''        let create = serde_json::to_vec(&PhenixValue::from(&SessionCommand::Create {\n            session: phenix_plugin_catalog::SessionRecord::new(\n                SessionId::parse("session-1").unwrap(),\n            ),\n        }))\n''', 'harness test session create')

          cargo = Path('rust/crates/phenix-harness/Cargo.toml')
          s = cargo.read_text()
          if 'parking_lot.workspace = true\n' not in s:
              anchor = 'phenix-sdk = { path = "../phenix-sdk" }\n'
              if s.count(anchor) != 1:
                  raise SystemExit('parking_lot anchor missing')
              cargo.write_text(s.replace(anchor, anchor + 'parking_lot.workspace = true\n', 1))

          p = Path('rust/crates/phenix-harness/src/application.rs')
          s = p.read_text()
          sdk_import = '''use phenix_sdk::{\n    execution_resource_service, execution_service, ExecutionAuthority, ExecutionCommand,\n    ExecutionResourceCommand, ExecutionResourceResponse, ExecutionResponse, RootBudgetLedger,\n    RootBudgetLimits,\n};\n'''
          if s.count(sdk_import) != 1:
              raise SystemExit('sdk import anchor missing')
          s = s.replace(sdk_import, sdk_import + 'use parking_lot::Mutex;\n', 1)

          if s.count('    harness: Arc<PhenixHarness>,\n') != 2:
              raise SystemExit('expected worker and runner harness types')
          s = s.replace('    harness: Arc<PhenixHarness>,\n', '    harness: Arc<Mutex<PhenixHarness>>,\n')

          pairs = [
              ('            harness: Arc::new(harness),\n', '            harness: Arc::new(Mutex::new(harness)),\n', 'constructor'),
              ("        R: for<'a> TryFrom<Project<'a>, Error = phenix_core::ValueError>,\n", "        R: for<'a> TryFrom<Project<&'a PhenixValue>, Error = phenix_core::ValueError>,\n", 'project bound'),
              ('    let output = harness\n        .invoke(&agent_loop_service(), &input, &authority, None)\n', '    let output = harness\n        .lock()\n        .invoke(&agent_loop_service(), &input, &authority, None)\n', 'runner lock'),
          ]
          for old, new, label in pairs:
              if s.count(old) != 1:
                  raise SystemExit(f'{label}: found {s.count(old)} anchors')
              s = s.replace(old, new, 1)

          shared = '        let output = self\n            .harness\n            .invoke('
          if s.count(shared) != 3:
              raise SystemExit(f'worker invoke sites: found {s.count(shared)}')
          s = s.replace(shared, '        let output = self\n            .harness\n            .lock()\n            .invoke(')

          old = '    let generation = CapabilityGenerationId::from(worker.harness.generation());\n'
          new = '''    let generation = {\n        let harness = worker.harness.lock();\n        CapabilityGenerationId::from(harness.generation())\n    };\n'''
          if s.count(old) != 1:
              raise SystemExit('generation anchor missing')
          s = s.replace(old, new, 1)

          old = '''        self.prepare_root_execution(&execution_id)?;\n        self.append_session_change(\n            &session,\n            SessionChange::Message {\n                message: Message {\n                    role: MessageRole::User,\n                    content: request.content,\n                },\n            },\n        )?;\n        Ok(PromptResult {\n'''
          new = '''        self.prepare_root_execution(&execution_id)?;\n        if let Err(error) = self.append_session_change(\n            &session,\n            SessionChange::Message {\n                message: Message {\n                    role: MessageRole::User,\n                    content: request.content,\n                },\n            },\n        ) {\n            let _ = self.finish_root_execution(&execution_id, false);\n            return Err(error);\n        }\n        Ok(PromptResult {\n'''
          if s.count(old) != 1:
              raise SystemExit('prompt cleanup anchor missing')
          s = s.replace(old, new, 1)

          old = '''        let response =\n            self.invoke_execution_resource(ExecutionResourceCommand::RegisterRootBudget {\n                ledger: RootBudgetLedger {\n                    root_execution_id: execution_id.to_owned(),\n                    limits: RootBudgetLimits {\n                        fresh_input_tokens: 128 * 1024,\n                        output_tokens: 16 * 1024,\n                        cost_microunits: None,\n                        attempts: 16,\n                    },\n                    reservations: BTreeMap::new(),\n                },\n            })?;\n        if !matches!(response, ExecutionResourceResponse::RootBudget { .. }) {\n            return Err(ApplicationError::InvalidResponse {\n                message: format!("unexpected root-budget registration response: {response:?}"),\n            });\n        }\n        Ok(())\n'''
          new = '''        let response = match self\n            .invoke_execution_resource(ExecutionResourceCommand::RegisterRootBudget {\n                ledger: RootBudgetLedger {\n                    root_execution_id: execution_id.to_owned(),\n                    limits: RootBudgetLimits {\n                        fresh_input_tokens: 128 * 1024,\n                        output_tokens: 16 * 1024,\n                        cost_microunits: None,\n                        attempts: 16,\n                    },\n                    reservations: BTreeMap::new(),\n                },\n            }) {\n            Ok(response) => response,\n            Err(error) => {\n                let _ = self.finish_root_execution(execution_id, false);\n                return Err(error);\n            }\n        };\n        if !matches!(response, ExecutionResourceResponse::RootBudget { .. }) {\n            let error = ApplicationError::InvalidResponse {\n                message: format!("unexpected root-budget registration response: {response:?}"),\n            };\n            let _ = self.finish_root_execution(execution_id, false);\n            return Err(error);\n        }\n        Ok(())\n'''
          if s.count(old) != 1:
              raise SystemExit('budget cleanup anchor missing')
          s = s.replace(old, new, 1)

          marker = '    #[test]\n    fn full_event_queue_rejects_mutation_before_journaling() {\n'
          test = '''    #[test]\n    fn prompt_journal_failure_finishes_prepared_root_execution() {\n        let (sender, _events) = mpsc::channel(1);\n        let mut worker = application_worker().with_event_sender(sender.clone());\n        let created = invoke_operation::<CreateSession>(\n            &mut worker,\n            SessionCreateInput { working_directory: "/workspace".into(), title: None },\n        )\n        .unwrap();\n        sender\n            .try_send(ApplicationEvent {\n                event: ContractId::parse("phenix.application.session-update@1").unwrap(),\n                payload: Acknowledged {}.to_value(),\n            })\n            .expect("fill event queue");\n\n        let error = invoke_operation::<Prompt>(\n            &mut worker,\n            PromptInput {\n                session_id: created.session_id,\n                content: vec![Content::Text { text: "hello".into() }],\n            },\n        )\n        .unwrap_err();\n        assert!(matches!(error, ApplicationError::Conflict { .. }));\n        let response = worker\n            .invoke_execution(ExecutionCommand::GetExecution { id: "execution-1".into() })\n            .unwrap();\n        let ExecutionResponse::ExecutionLookup { execution: Some(execution) } = response else {\n            panic!("prepared execution must remain queryable");\n        };\n        assert_eq!(execution.state, phenix_sdk::ExecutionState::Failed);\n    }\n\n'''
          if s.count(marker) != 1:
              raise SystemExit('test marker missing')
          s = s.replace(marker, test + marker, 1)
          p.write_text(s)

          once('rust/crates/phenix-plugin-execution/src/review.rs',
               '    PluginHost, PluginInstance, Project, ResourceNamespace, ServiceId, TransactionOp, ValueCodec,\n',
               '    PluginHost, PluginInstance, ResourceNamespace, ServiceId, TransactionOp, ValueCodec,\n', 'review import')
          once('rust/crates/phenix-acp-stdio/src/transport.rs',
               '        ClientToolRemoveInput as ApplicationClientToolRemoveInput, ElicitationHandlerRef,\n',
               '        ClientToolRemoveInput as ApplicationClientToolRemoveInput,\n', 'transport import')
          PY
      - name: Format and targeted test
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo test --manifest-path rust/Cargo.toml -p phenix-harness prompt_journal_failure_finishes_prepared_root_execution
      - name: Remove temporary workflow and push
        run: |
          rm .github/workflows/pr504-lifecycle-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(nvim): serialize mutable runtime access'
          git push origin HEAD:spec/nvim-client-package
