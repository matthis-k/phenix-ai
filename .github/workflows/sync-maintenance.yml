name: Maintenance autofix

on:
  pull_request:

permissions:
  actions: write
  contents: write

concurrency:
  group: maintenance-autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply PR 504 typed continuation
        if: github.event.pull_request.number == 504
        run: |
          set -euo pipefail
          if ! grep -q 'pub struct ModelToolTurn' rust/crates/phenix-core/src/agent.rs; then
            python3 -c 'from pathlib import Path; lines=Path(".github/workflows/pr504-continuation.yml").read_text().splitlines(); start=next(i for i,l in enumerate(lines) if "python3 - <<\x27PY\x27" in l)+1; end=next(i for i in range(start,len(lines)) if lines[i].strip()=="PY"); s="\n".join(line[10:] if line.startswith("          ") else line for line in lines[start:end]); s=s.replace("fn parse_json(\\n","fn parse_json("); exec(compile(s,"pr504-continuation","exec"))'
          fi
          python3 .github/pr504-application-loop.py
          cargo fmt --manifest-path rust/Cargo.toml --all
          git diff --check

      - name: Persist PR 504 typed continuation
        if: github.event.pull_request.number == 504
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if test -z "$(git status --porcelain=v1 --untracked-files=all)"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(nvim): complete typed client tool continuation"
          git push origin "HEAD:$HEAD_REF"

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Apply deterministic maintenance fixes
        run: |
          set -euo pipefail
          nix flake update phenix-flake-ci
          printf '%s\n' '{"command":"fix","source":{"type":"maintenance-autofix"}}' |
            nix run --quiet .#phenix-maintenance-command-1c6e6c4c02e5 -- invoke
          nix develop --command bash -lc 'cd rust && cargo metadata --format-version 1 >/dev/null'
          git diff --check

      - name: Commit autofixes
        id: commit
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          if test -z "$(git status --porcelain=v1 --untracked-files=all)"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply CI autofixes"
          git push origin "HEAD:$HEAD_REF"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Validate corrected head
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: gh workflow run ci.yml --ref "$HEAD_REF"
