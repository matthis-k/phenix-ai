# Keep the legacy PR check name during migration, but do not push fixes to PR branches.
# CI's Source job owns mandatory formatting and static validation.
name: Maintenance autofix

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autofix:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Verify committed diff has no whitespace errors
        run: |
          set -euo pipefail
          git diff --check HEAD^ HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  # Optional repair aid for changes made by GitHub API or other hookless clients.
  # Produces a patch to apply to a local candidate; never commits or pushes it.
  propose-fixes:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Propose deterministic normalization patch
        id: patch
        run: |
          set -euo pipefail
          printf '%s\n' '{"command":"fix","source":{"type":"maintenance-patch"}}' |
            nix run --quiet --no-write-lock-file .#phenix-maintenance-command-1c6e6c4c02e5 -- invoke
          git diff --binary > maintenance-fixes.patch
          if test -s maintenance-fixes.patch; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No mechanical changes needed" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload proposed patch
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maintenance-fixes
          path: maintenance-fixes.patch
          retention-days: 7
