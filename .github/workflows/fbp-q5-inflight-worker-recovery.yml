name: "FBP Q5 In-Flight Worker Recovery"
on:
  pull_request:
    paths:
      - "packages/phenix-graphs/src/process.rs"
      - "packages/phenix-graphs/src/process/handoff_model.rs"
      - "packages/phenix-graphs/src/runtime/execution.rs"
      - "packages/phenix-graphs/src/runtime/recovery.rs"
      - "packages/phenix-graphs/src/runtime/scheduling.rs"
      - "packages/phenix-graphs/src/runtime/wake.rs"
      - "packages/phenix-graphs/src/connection.rs"
      - "packages/phenix-graphs/src/failure.rs"
      - "packages/phenix-graphs/src/value.rs"
      - "packages/phenix-graphs/tests/fbp_handoff_history.rs"
      - "packages/phenix-graphs/tests/fbp_inflight_worker_recovery.rs"
      - ".github/workflows/fbp-q5-inflight-worker-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-worker-cancellation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - name: Record source and execution environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            echo "candidate=$(git rev-parse HEAD)"
            echo "workflow_sha=$GITHUB_SHA"
            date -u +%FT%TZ
            uname -a
            lscpu | grep -E '^(Architecture|CPU\(s\)|Model name):' || true
            nix --version
            nix develop --command rustc -vV
          } > artifacts/environment.txt
          sha256sum \
            packages/phenix-graphs/src/process.rs \
            packages/phenix-graphs/src/process/handoff_model.rs \
            packages/phenix-graphs/src/runtime/execution.rs \
            packages/phenix-graphs/src/runtime/recovery.rs \
            packages/phenix-graphs/src/runtime/scheduling.rs \
            packages/phenix-graphs/src/runtime/wake.rs \
            packages/phenix-graphs/src/connection.rs \
            packages/phenix-graphs/src/failure.rs \
            packages/phenix-graphs/src/value.rs \
            packages/phenix-graphs/tests/fbp_handoff_history.rs \
            packages/phenix-graphs/tests/fbp_inflight_worker_recovery.rs \
            > artifacts/source-hashes.txt
          cat artifacts/environment.txt
          cat artifacts/source-hashes.txt
      - name: Run the bounded handoff and public history suites once
        shell: bash
        run: |
          set -euo pipefail
          export RUST_BACKTRACE=1
          nix develop --command cargo test --locked \
            -p phenix-graph --lib process::handoff_model \
            -- --nocapture --test-threads=1 \
            2>&1 | tee artifacts/handoff-model.log
          nix develop --command cargo test --locked \
            -p phenix-graph --test fbp_handoff_history \
            -- --nocapture --test-threads=1 \
            2>&1 | tee artifacts/handoff-history.log
          nix develop --command cargo test --locked \
            -p phenix-graph --test fbp_inflight_worker_recovery \
            -- --nocapture --test-threads=1 \
            2>&1 | tee artifacts/worker-baseline.log
      - name: Repeat real in-flight cancellation and fresh completion 12 times
        shell: bash
        run: |
          set -euo pipefail
          export RUST_BACKTRACE=1
          for repeat in $(seq 1 12); do
            nix develop --command cargo test --locked \
              -p phenix-graph --test fbp_inflight_worker_recovery \
              -- --nocapture --test-threads=1 \
              > "artifacts/worker-$repeat.log" 2>&1 || {
                cat "artifacts/worker-$repeat.log"
                exit 1
              }
            echo "repeat $repeat: seven worker tests passed (five baseline frames and four added identity/composition tests, both queue policies where required)"
            tail -n 4 "artifacts/worker-$repeat.log"
          done
          {
            echo "Baseline: bounded handoff model, public handoff history, and worker suite each ran once with --nocapture."
            echo "Worker repeat loop: 12 additional deterministic executions."
                       echo "Per worker execution: seven tests. Baseline: five frames = 48 legacy rounds plus two publication-order frames at one round each."
            echo "Added: same-session wrong-index, cross-session identity/wake, both-policy publication-pending cancellation, and both-policy non-emitting old Complete through five fresh boundaries."
            echo "The repeated executions are deterministic witnesses, not exhaustive interleaving coverage."
          } | tee artifacts/coverage-summary.txt
      - name: Save checks and exact-head provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fbp-q5-inflight-recovery-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/
          if-no-files-found: warn
