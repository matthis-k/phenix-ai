# Temporary, branch-scoped lock calculation; removed before merging.
name: CI library lock materialization
on:
  pull_request:
  push:
    branches:
      - ci/adopt-declarative-test-assertions
permissions:
  contents: read
jobs:
  generate-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
      - name: Resolve immutable test library input
        run: |
          set -euo pipefail
          nix flake lock
          echo 'BEGIN_PHENIX_FLAKE_LOCK'
          cat flake.lock
          echo 'END_PHENIX_FLAKE_LOCK'
