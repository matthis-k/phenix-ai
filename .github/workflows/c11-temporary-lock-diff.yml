name: Temporary C11 Cargo lock normalization probe
on:
  pull_request:
    paths:
      - '.github/workflows/c11-temporary-lock-diff.yml'
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          cargo check --offline -p phenix-plugin-provider-openai-api || true
          git diff -- Cargo.lock
          cargo test --locked -p phenix-plugin-provider-openai-api --no-run || true
