# One-shot focused finalizer for PR #504. The job removes this workflow before committing.
name: PR 504 application facade finalizer

on:
  push:
    branches: [spec/nvim-client-package]

concurrency:
  group: pr504-application-facade-finalizer
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spec/nvim-client-package
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: Finalize application facade contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          tools = Path('rust/crates/phenix-binding-lua/src/tools.rs')
          text = tools.read_text()
          old = '''pub(super) fn exports(lua: &Lua) -> LuaResult<Table> {
    let tools = lua.create_table()?;
    tools.set(
        "connect",
        lua.create_function(|lua, options: Table| facade::connect(lua, options))?,
    )?;
    tools.set(
        "register",
'''
          new = '''pub(super) fn exports(lua: &Lua) -> LuaResult<Table> {
    let tools = lua.create_table()?;
    tools.set(
        "register",
'''
          if text.count(old) != 1:
              raise SystemExit('tools facade export shape changed')
          text = text.replace(old, new, 1)
          marker = '''    Ok(tools)
}

pub(super) fn bind'''
          replacement = '''    Ok(tools)
}

pub(super) fn facade_exports(lua: &Lua) -> LuaResult<Table> {
    let application = lua.create_table()?;
    application.set(
        "connect",
        lua.create_function(|lua, options: Table| facade::connect(lua, options))?,
    )?;
    Ok(application)
}

pub(super) fn bind'''
          if text.count(marker) != 1:
              raise SystemExit('tools export terminator changed')
          tools.write_text(text.replace(marker, replacement, 1))

          facade = Path('rust/crates/phenix-binding-lua/src/facade.rs')
          text = facade.read_text()
          old = 'let data = item.get::<mlua::String>("data")?;'
          new = 'let data = item.get::<mlua::LuaString>("data")?;'
          if text.count(old) != 1:
              raise SystemExit('Lua image-string conversion shape changed')
          facade.write_text(text.replace(old, new, 1))

          lib = Path('rust/crates/phenix-binding-lua/src/lib.rs')
          text = lib.read_text()
          old = '    exports.set("tools", tools::exports(lua)?)?;\n'
          new = old + '    exports.set("application", tools::facade_exports(lua)?)?;\n'
          if text.count(old) != 1:
              raise SystemExit('native export shape changed')
          lib.write_text(text.replace(old, new, 1))

          runtime = Path('clients/nvim/lua/phenix_nvim/runtime.lua')
          text = runtime.read_text()
          old = '  local facade = native.tools and native.tools.connect\n'
          new = '  local facade = native.application and native.application.connect\n'
          if text.count(old) != 1:
              raise SystemExit('runtime facade lookup shape changed')
          text = text.replace(old, new, 1)

          marker = 'function M.cancel_active()\n'
          if text.count(marker) != 1:
              raise SystemExit('runtime cancel marker changed')
          controls = '''local function active_session_request(method, callback, ...)
  if not require_ready(callback) then
    return
  end
  local session = state.active_session
  if session == nil then
    util.safe_call(callback, nil, { message = "no active Phenix session" })
    return
  end
  local callable = session[method]
  if type(callable) ~= "function" then
    util.safe_call(callback, nil, { message = "Phenix session does not support " .. method })
    return
  end
  local ok, request = pcall(callable, session, ...)
  if not ok then
    util.safe_call(callback, nil, { message = tostring(request) })
    return
  end
  M.track(request, function(result, error)
    if error == nil then
      emit("status", M.status())
    end
    util.safe_call(callback, result, error)
  end)
end

function M.list_models(callback)
  active_session_request("models", callback)
end

function M.select_model(model_id, callback)
  active_session_request("select_model", callback, model_id)
end

function M.list_routing_profiles(callback)
  active_session_request("routing_profiles", callback)
end

function M.select_routing_profile(profile_id, callback)
  active_session_request("select_routing_profile", callback, profile_id)
end

'''
          runtime.write_text(text.replace(marker, controls + marker, 1))
          PY

          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo run --manifest-path rust/Cargo.toml --quiet --locked -p phenix-application-interface \
            --bin phenix-application-descriptor \
            > share/phenix/interfaces/phenix.application@1.json
          cargo run --manifest-path rust/Cargo.toml --quiet --locked -p phenix-application-interface \
            --bin phenix-application-descriptor -- \
            --rust share/phenix/interfaces/phenix.application@1.json \
            > rust/crates/phenix-application-interface/fixtures/application.rs
          cargo fmt --manifest-path rust/Cargo.toml --all

          cargo run --manifest-path rust/Cargo.toml --quiet --locked -p phenix-application-interface \
            --bin phenix-application-descriptor -- \
            --check share/phenix/interfaces/phenix.application@1.json
          cargo clippy --manifest-path rust/Cargo.toml --locked -p phenix-binding-lua --all-targets -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --locked -p phenix-application-interface -p phenix-binding-lua
          nix build --no-link .#checks.x86_64-linux.phenix-nvim-load
          git diff --check

          rm -f .phenix/work/pr-504.md
          rm -f .github/workflows/pr504-ui-wire.yml
      - name: Commit finalized fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(nvim): finalize application facade contract'
          git push origin HEAD:spec/nvim-client-package
