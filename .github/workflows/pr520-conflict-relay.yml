name: PR 520 conflict relay

on:
  push:
    branches:
      - refactor/durable-collections
    paths:
      - .github/workflows/pr520-conflict-relay.yml
      - .phenix/pr520-conflict.py

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/durable-collections
          fetch-depth: 0
      - name: Apply conflict transformation
        run: python .phenix/pr520-conflict.py
      - name: Remove relay files
        run: |
          rm .phenix/pr520-conflict.py .github/workflows/pr520-conflict-relay.yml
          rmdir .phenix || true
      - name: Format
        working-directory: rust
        run: cargo fmt --all
      - name: Test persistence host semantics
        working-directory: rust
        run: cargo test -p phenix-core persistence
      - name: Push implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: preserve durable transaction conflicts"
          git push origin HEAD:refactor/durable-collections
