# Explicit manual benchmark; intentionally does not replace production CI.
# Run 2, then 4, then 8 remote builders to avoid cross-variant contention.
name: Phenix Nix remote-builder 2/4/8 benchmark
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: remote-builders-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  credential-check:
    name: Verify Tailscale OIDC setup before allocating builders
    runs-on: ubuntu-24.04
    steps:
      - name: Require GitHub repository variables or secrets
        env:
          CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID || vars.TS_OAUTH_CLIENT_ID }}
          AUDIENCE: ${{ secrets.TS_AUDIENCE || vars.TS_AUDIENCE }}
        run: |
          if [[ -z "$CLIENT_ID" || -z "$AUDIENCE" ]]; then
            echo '::error::Missing Tailscale federated identity configuration. See https://github.com/matthis-k/phenix-flake-ci/blob/ci/nix-remote-builders/docs/distributed-nix-builders.md'
            echo 'Add GitHub Actions repository variables TS_OAUTH_CLIENT_ID and TS_AUDIENCE (or secrets with those names).'
            exit 1
          fi

  remote-2:
    name: 2 remote builders
    needs: credential-check
    uses: matthis-k/phenix-flake-ci/.github/workflows/flake-nix-builders.yml@25995cf581520ba8927dccc8d7202171a0600fa7
    with:
      config: ci/flake-check-config.nix
      library_ref: 25995cf581520ba8927dccc8d7202171a0600fa7
      worker_count: 2
      slots_per_worker: 2
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID || vars.TS_OAUTH_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE || vars.TS_AUDIENCE }}

  remote-4:
    name: 4 remote builders
    needs: remote-2
    if: needs.remote-2.result == 'success'
    uses: matthis-k/phenix-flake-ci/.github/workflows/flake-nix-builders.yml@25995cf581520ba8927dccc8d7202171a0600fa7
    with:
      config: ci/flake-check-config.nix
      library_ref: 25995cf581520ba8927dccc8d7202171a0600fa7
      worker_count: 4
      slots_per_worker: 2
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID || vars.TS_OAUTH_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE || vars.TS_AUDIENCE }}

  remote-8:
    name: 8 remote builders
    needs: remote-4
    if: needs.remote-4.result == 'success'
    uses: matthis-k/phenix-flake-ci/.github/workflows/flake-nix-builders.yml@25995cf581520ba8927dccc8d7202171a0600fa7
    with:
      config: ci/flake-check-config.nix
      library_ref: 25995cf581520ba8927dccc8d7202171a0600fa7
      worker_count: 8
      slots_per_worker: 2
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID || vars.TS_OAUTH_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE || vars.TS_AUDIENCE }}
