# Explicit manual benchmark; intentionally does not replace production CI.
# Run 2, then 4, then 8 remote builders to avoid cross-variant contention.
# Retry after declaring tag:phenix-ci and enabling tailnet self-SSH grants.
name: Phenix Nix remote-builder 2/4/8 benchmark
on:
  workflow_dispatch:
  push:
    branches:
      - ci/m1-remote-builder-benchmark

permissions:
  contents: read
  id-token: write

concurrency:
  group: remote-builders-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  credential-check:
    name: Verify Tailscale OIDC setup and derived audience
    runs-on: ubuntu-24.04
    steps:
      - name: Require federated Client ID or auth key
        env:
          CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID || vars.TS_OAUTH_CLIENT_ID }}
          AUDIENCE: ${{ format('api.tailscale.com/{0}', secrets.TS_OAUTH_CLIENT_ID || vars.TS_OAUTH_CLIENT_ID) }}
          AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          if [[ -n "$AUTHKEY" ]]; then
            if [[ -n "$CLIENT_ID" || -n "$AUDIENCE" ]]; then
              echo "::error::Use either TS_AUTHKEY or the complete OIDC pair, not both."
              exit 1
            fi
          elif [[ -z "$CLIENT_ID" || -z "$AUDIENCE" ]]; then
            echo '::error::Missing Tailscale identity: add TS_AUTHKEY secret, or TS_OAUTH_CLIENT_ID and TS_AUDIENCE variables/secrets.'
            echo 'See https://github.com/matthis-k/phenix-flake-ci/blob/ci/nix-remote-builders/docs/distributed-nix-builders.md'
            exit 1
          fi

      - name: Validate federated audience and GitHub token claims
        env:
          CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID || vars.TS_OAUTH_CLIENT_ID }}
          AUDIENCE: ${{ format('api.tailscale.com/{0}', secrets.TS_OAUTH_CLIENT_ID || vars.TS_OAUTH_CLIENT_ID) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import fnmatch
          import json
          import os
          import urllib.parse
          import urllib.request

          client = os.environ["CLIENT_ID"]
          audience = os.environ["AUDIENCE"]
          if client != client.strip() or audience != audience.strip():
              raise SystemExit("Invalid Tailscale secret: leading/trailing whitespace")
          expected = f"api.tailscale.com/{client}"
          if audience != expected:
              raise SystemExit("Computed OIDC audience did not match expected client ID format.")
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=" + urllib.parse.quote(audience, safe="")
          headers = {"Authorization": f"Bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"}
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=15) as response:
              token = json.load(response)["value"]
          parts = token.split(".")
          if len(parts) != 3:
              raise SystemExit("GitHub returned an invalid OIDC identity token")
          claims = json.loads(base64.urlsafe_b64decode(parts[1] + "=" * (-len(parts[1]) % 4)))
          expected_subject = "repo:matthis-k@69082876/phenix-ai@1281803146:*"
          print(f"Observed GitHub OIDC subject: {claims.get('sub', '')}")
          checks = {
              "issuer": claims.get("iss") == "https://token.actions.githubusercontent.com",
              "subject": fnmatch.fnmatchcase(claims.get("sub", ""), expected_subject),
              "audience": claims.get("aud") == audience,
              "repository": claims.get("repository") == "matthis-k/phenix-ai",
          }
          for name, ok in checks.items():
              print(f"OIDC {name} matches configured trust: {ok}")
          if not all(checks.values()):
              raise SystemExit("GitHub OIDC claims do not match expected Tailscale trust configuration")
          PY

  remote-2:
    name: 2 remote builders
    needs: credential-check
    uses: matthis-k/phenix-flake-ci/.github/workflows/flake-nix-builders.yml@f47edcf5ef94c8caddadf1e096a5b9d0bfb2ad75
    with:
      config: ci/flake-check-config.nix
      library_ref: f47edcf5ef94c8caddadf1e096a5b9d0bfb2ad75
      worker_count: 2
      slots_per_worker: 2
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID || vars.TS_OAUTH_CLIENT_ID }}
      TS_AUDIENCE: ${{ format('api.tailscale.com/{0}', secrets.TS_OAUTH_CLIENT_ID || vars.TS_OAUTH_CLIENT_ID) }}
      TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}

  remote-4:
    name: 4 remote builders
    needs: remote-2
    if: needs.remote-2.result == 'success'
    uses: matthis-k/phenix-flake-ci/.github/workflows/flake-nix-builders.yml@f47edcf5ef94c8caddadf1e096a5b9d0bfb2ad75
    with:
      config: ci/flake-check-config.nix
      library_ref: f47edcf5ef94c8caddadf1e096a5b9d0bfb2ad75
      worker_count: 4
      slots_per_worker: 2
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID || vars.TS_OAUTH_CLIENT_ID }}
      TS_AUDIENCE: ${{ format('api.tailscale.com/{0}', secrets.TS_OAUTH_CLIENT_ID || vars.TS_OAUTH_CLIENT_ID) }}
      TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}

  remote-8:
    name: 8 remote builders
    needs: remote-4
    if: needs.remote-4.result == 'success'
    uses: matthis-k/phenix-flake-ci/.github/workflows/flake-nix-builders.yml@f47edcf5ef94c8caddadf1e096a5b9d0bfb2ad75
    with:
      config: ci/flake-check-config.nix
      library_ref: f47edcf5ef94c8caddadf1e096a5b9d0bfb2ad75
      worker_count: 8
      slots_per_worker: 2
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID || vars.TS_OAUTH_CLIENT_ID }}
      TS_AUDIENCE: ${{ format('api.tailscale.com/{0}', secrets.TS_OAUTH_CLIENT_ID || vars.TS_OAUTH_CLIENT_ID) }}
      TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
