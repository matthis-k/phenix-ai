name: Propagate consolidated FBP documentation
on:
  push:
    branches: [automation/fbp-doc-propagation-20261125]
    paths: [.github/workflows/propagate-fbp-docs.yml]
permissions:
  contents: write
  pull-requests: read
jobs:
  propagate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Propagate and verify branch trees
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess, tempfile, posixpath, re
          from pathlib import Path
          def run(*args, env=None, data=None, check=True):
              return subprocess.run(args, input=data, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, env=env, check=check)
          def git(*args, env=None, data=None):
              return run('git', *args, env=env, data=data).stdout.strip()
          canonical = '3187e6ebcde9ae61c8d136e3d8711c2545cc8e30'
          root = 'fix/fbp-h2-event-callback-20261112'
          api = 'packages/phenix-graphs/API-EXAMPLES.md'
          rules = {
              '.github/workflows/fbp-h6-agent-allocation-benchmark.yml': ['docs/fbp-h6-agent-allocation-measurement-20261113.md'],
              '.github/workflows/fbp-q5-loom-actual-wake.yml': ['docs/fbp-q5-loom-wake-20261113.md','docs/fbp-issue-progress-estimates-20261113.md'],
              '.github/workflows/fbp-q5-notifier-retirement-concurrency.yml': ['docs/fbp-q5-notifier-retirement-interleavings-20261113.md'],
              '.github/workflows/fbp-q5-session-ownership.yml': ['docs/fbp-hardening-campaign-20261114.md'],
          }
          repo = os.environ['GITHUB_REPOSITORY']
          raw = run('gh','api','--paginate','--slurp',f'repos/{repo}/pulls?state=open&per_page=100').stdout
          prs = {p['head']['ref']: p for page in json.loads(raw) for p in page if p['head']['repo'] and p['head']['repo']['full_name']==repo and p['base']['repo']['full_name']==repo}
          assert root in prs
          scope = {root}
          while True:
              nxt = scope | {r for r,p in prs.items() if p['base']['ref'] in scope}
              if nxt == scope: break
              scope = nxt
          assert 'integrate/fbp-foundation-acceptance-20261123' in scope
          old = {r:git('rev-parse','refs/remotes/origin/'+r) for r in scope}
          def tree(commit):
              return {p.split('\t',1)[1]:p.split('\t',1)[0].split() for p in git('ls-tree','-r',commit).splitlines()}
          canonical_files = tree(canonical)
          canonical_docs = {p for p in canonical_files if p.startswith('docs/')}
          assert canonical_docs == {'docs/fbp-design.md','docs/infrastructure.md'}
          desired = {p:canonical_files[p] for p in canonical_docs | {'AGENTS.md','GLOSSARY.md'}}
          cache = {}
          def content(sha):
              if sha not in cache:
                  cache[sha] = run('git','cat-file','blob',sha).stdout
              return cache[sha]
          def allowed(path, workflows):
              return path.startswith('docs/') or path in {'AGENTS.md','GLOSSARY.md'} or path.endswith('.md') and path.startswith('packages/') or workflows and path in rules
          def changes(a,b):
              return git('diff','--name-only',a,b).splitlines()
          def build(workflows):
              done = {}
              order = []
              detached = []
              with tempfile.TemporaryDirectory() as tmp:
                  env = dict(os.environ, GIT_INDEX_FILE=tmp+'/index', GIT_AUTHOR_NAME='Phenix documentation', GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com', GIT_COMMITTER_NAME='Phenix documentation', GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com')
                  def idx(*args,data=None): return git(*args,env=env,data=data)
                  def setblob(path,mode,sha): idx('update-index','--add','--cacheinfo',f'{mode},{sha},{path}')
                  def put(path,mode,text): setblob(path,mode,git('hash-object','-w','--stdin',data=text))
                  while len(done)<len(scope):
                      ready = sorted((r for r in scope-done.keys() if r==root or prs[r]['base']['ref'] in done),key=lambda r:prs[r]['number'])
                      assert ready, 'PR base cycle'
                      for r in ready:
                          o=old[r]
                          entries=tree(o)
                          idx('read-tree',o)
                          for p in entries.keys()-desired.keys():
                              if p.startswith('docs/'): idx('update-index','--force-remove','--',p)
                          for p,(mode,kind,sha) in desired.items(): setblob(p,mode,sha)
                          # Retain branch-local API guidance; historical references point at Git history.
                          for p,(mode,kind,sha) in entries.items():
                              if p.startswith('packages/') and p.endswith('.md'):
                                  s=content(sha)
                                  n=s.replace('`docs/fbp-regression-ledger.md` at the workspace root.','the regression ledger in Git history. Durable requirements are in `docs/fbp-design.md`.')
                                  def link(m):
                                      dest=m.group(1)
                                      resolved=posixpath.normpath(posixpath.join(posixpath.dirname(p),dest.split('#')[0]))
                                      if resolved.startswith('docs/') and resolved in entries and resolved not in canonical_docs:
                                          frag = '#'+dest.split('#',1)[1] if '#' in dest else ''
                                          return ']('+f'https://github.com/{repo}/blob/{o}/{resolved}'+frag+')'
                                      return m.group(0)
                                  n=re.sub(r'\]\(([^\s)]+)\)',link,n)
                                  if n!=s: put(p,mode,n)
                              if workflows and p in rules:
                                  s=content(sha)
                                  n=''.join(l for l in s.splitlines(keepends=True) if l.strip() not in {'- "'+d+'"' for d in rules[p]})
                                  if n!=s: put(p,mode,n)
                          t=idx('write-tree')
                          base=done.get(prs[r]['base']['ref'])
                          parents=['-p',o]
                          if base and run('git','merge-base','--is-ancestor',base,o,check=False).returncode!=0:
                              mb=git('merge-base',o,base)
                              if all(allowed(p,workflows) for p in changes(mb,base)):
                                  parents+=['-p',base]
                              else:
                                  detached.append(prs[r]['number'])
                          if t==git('rev-parse',o+'^{tree}') and len(parents)==2:
                              done[r]=o
                          else:
                              new=idx('commit-tree',t,*parents,data='docs: inherit consolidated foundation documentation\n\nPreserve branch implementation and historical evidence in Git history.\n')
                              assert all(allowed(p,workflows) for p in changes(o,new)), (r,changes(o,new))
                              done[r]=new
                          actual=tree(done[r])
                          assert {p for p in actual if p.startswith('docs/')}==canonical_docs
                          assert all(actual[p]==v for p,v in desired.items())
                          assert all(actual.get(p)==v for p,v in entries.items() if not allowed(p,workflows))
                          order.append(r)
              return done,order,detached
          def push(done,order):
              refs=[done[r]+':refs/heads/'+r for r in order if done[r]!=old[r]]
              if not refs: return True,0,''
              p=run('git','push','--atomic','origin',*refs,check=False)
              print(p.stdout,p.stderr,flush=True)
              return p.returncode==0,len(refs),p.stderr
          done,order,detached=build(True)
          ok,count,err=push(done,order)
          if not ok and ('workflow' in err.lower() and ('permission' in err.lower() or 'refusing' in err.lower())):
              print('Workflow write permission unavailable; retrying without path-filter changes.',flush=True)
              done,order,detached=build(False)
              ok,count,err=push(done,order)
          assert ok,'Atomic branch update rejected'
          actual = dict((ref.removeprefix('refs/heads/'),sha) for sha,ref in (line.split() for line in git('ls-remote','--heads','origin').splitlines()))
          assert all(actual.get(r)==done[r] for r in order), 'Remote head verification failed'
          summary={'scope':len(scope),'updated':count,'verified':len(order),'preexisting_ancestry_gaps':detached,'branches':[{'pr':prs[r]['number'],'branch':r,'old':old[r],'new':done[r]} for r in order]}
          Path('propagation-summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps({k:v for k,v in summary.items() if k!='branches'}),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: propagation-summary
          path: propagation-summary.json
