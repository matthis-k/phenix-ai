name: PR 504 refresh application fixture

on:
  push:
    branches: [spec/nvim-client-package]

concurrency:
  group: pr504-refresh-application-fixture
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spec/nvim-client-package
      - name: Regenerate fixed application fixture
        run: |
          cargo run --manifest-path rust/Cargo.toml -p phenix-application-interface --bin phenix-application-descriptor --quiet > rust/crates/phenix-application-interface/fixtures/application.rs
          git diff --check
      - name: Commit generated fixture
        run: |
          rm .github/workflows/pr504-refresh-application-fixture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(nvim): refresh application interface fixture'
          git push origin HEAD:spec/nvim-client-package
