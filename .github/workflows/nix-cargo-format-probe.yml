name: Cargo source Nix formatting probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  canonical-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
      - name: Render canonical nixfmt diff
        shell: bash
        run: |
          set -euo pipefail
          nix shell --impure \
            --expr '(builtins.getFlake (toString ./.)).inputs.nixpkgs.legacyPackages.x86_64-linux.nixfmt' \
            --command nixfmt modules/cargo-source.nix
          git diff -- modules/cargo-source.nix
