# Manual full-DAG diagnostic, retained after PR cutover to staged fan-out.
# No secrets or remote builder credentials; not an automatic PR gate.
name: Phenix full single-store Nix DAG (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

# Only the newest source commit needs PR evidence. Manual and push runs
# retain independent identities and are never cancelled by a PR update.
concurrency:
  group: p1-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generated:
    uses: matthis-k/phenix-flake-ci/.github/workflows/flake-local-dag.yml@385ef2e774603d021f60245cc66114ebcdf25831
    with:
      config: ci/flake-check-config.nix
      library_ref: 385ef2e774603d021f60245cc66114ebcdf25831
