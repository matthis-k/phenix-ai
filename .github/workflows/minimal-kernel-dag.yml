# Experimental generated dependency DAG CI. The existing canonical and
# full-matrix workflows remain intact for same-head evidence comparison.
name: Phenix generated Nix DAG candidate
on:
  push:
    branches: [ci/m1-dag-staged]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Each PR needs exact-head verification, never simultaneous stale-head
# compilations. Scope by workflow and PR ID so different PRs and validation
# gates do not cancel one another (and push/manual runs use their ref).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generated:
    uses: matthis-k/phenix-flake-ci/.github/workflows/flake-dag-staged.yml@1d67b9f1bad2b5dce10ad1934023e02016f84ccd
    with:
      config: ci/flake-check-config.nix
      library_ref: 1d67b9f1bad2b5dce10ad1934023e02016f84ccd
