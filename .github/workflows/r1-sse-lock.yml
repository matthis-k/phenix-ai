# Temporary lock-resolution gate for the new SSE parser dependency.
# Upload the exact Cargo resolution, then commit it and remove this workflow.
name: R1 SSE lock resolution
on:
  pull_request:
    paths:
      - "crates/phenix-plugin-model-http/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/r1-sse-lock.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          set -euo pipefail
          cargo fetch --manifest-path Cargo.toml
          grep -A 2 '^name = "sse-parse"' Cargo.lock
          git diff --stat -- Cargo.lock
      - uses: actions/upload-artifact@v4
        with:
          name: r1-sse-cargo-lock-${{ github.sha }}
          path: Cargo.lock
