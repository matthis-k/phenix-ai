name: Minimal kernel conformance
on:
  push:
    branches: [rewrite/minimal-kernel]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conformance:
    if: github.event_name != 'pull_request' || github.head_ref == 'rewrite/minimal-kernel' || startsWith(github.head_ref, 'impl/m1-') || startsWith(github.head_ref, 'test/m1-') || (github.head_ref == 'ci/m1-flake-generic-checks' || startsWith(github.head_ref, 'ci/m1-'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/install-nix-action@v31
      - name: Canonical checks on the exact branch head
        run: |
          if [[ "${{ github.head_ref }}" == impl/m1-agent-preflight ]]; then
            nix build .#checks.x86_64-linux.a0-agent-product -L
          fi
          if [[ "${{ github.head_ref }}" == impl/m1-live-state ]]; then
            nix build .#checks.x86_64-linux.m1-live-state-product -L
          fi
          if [[ "${{ github.head_ref }}" == impl/m1-value-sdk ]]; then
            nix build .#checks.x86_64-linux.m1-value-sdk-product -L
          fi
          if [[ "${{ github.head_ref }}" == impl/m1-contract-authoring || "${{ github.head_ref }}" == impl/m1-architecture-consolidation || "${{ github.head_ref }}" == impl/m1-only-runtime || "${{ github.head_ref }}" == impl/m1-authoring-acceptance ]]; then
            nix build .#checks.x86_64-linux.m1-contract -L
            nix build .#checks.x86_64-linux.m1-native-authoring -L
          fi
          nix build .#checks.x86_64-linux.m1-metadata-state -L
          nix flake check -L
      - name: Record realized conformance outputs and commit
        run: |
          nix build .#phenix-m1-conformance --out-link result-conformance
          mkdir ci-evidence
          if [[ "${{ github.head_ref }}" == impl/m1-* ]]; then
            nix build .#checks.x86_64-linux.m1-reference-wire --out-link result-m1-wire
            nix build .#checks.x86_64-linux.m1-metadata-state --out-link result-m1-state
            cp -RL result-m1-state ci-evidence/m1-metadata-state
            nix path-info --json ./result-m1-state > ci-evidence/m1-state-nix-output.json
            cp -RL result-m1-wire ci-evidence/m1-reference-wire
            nix path-info --json ./result-m1-wire > ci-evidence/m1-nix-output.json
          fi
          if [[ "${{ github.head_ref }}" == impl/m1-agent-preflight ]]; then
            nix build .#checks.x86_64-linux.a0-agent --out-link result-a0-agent
            nix build .#checks.x86_64-linux.a0-agent-product --out-link result-a0-product
            cp -RL result-a0-agent ci-evidence/a0-agent
            cp -RL result-a0-product ci-evidence/a0-agent-product
            nix path-info --json ./result-a0-agent ./result-a0-product > ci-evidence/a0-nix-output.json
          fi
          if [[ "${{ github.head_ref }}" == impl/m1-live-state ]]; then
            nix build .#checks.x86_64-linux.m1-live-state --out-link result-m1-live
            nix build .#checks.x86_64-linux.m1-live-state-product --out-link result-m1-live-product
            cp -RL result-m1-live ci-evidence/m1-live-state
            cp -RL result-m1-live-product ci-evidence/m1-live-state-product
            nix path-info --json ./result-m1-live ./result-m1-live-product > ci-evidence/m1-live-nix-output.json
          fi
          if [[ "${{ github.head_ref }}" == impl/m1-value-sdk ]]; then
            nix build .#checks.x86_64-linux.m1-value-sdk --out-link result-m1-sdk
            nix build .#checks.x86_64-linux.m1-value-sdk-product --out-link result-m1-sdk-product
            cp -RL result-m1-sdk ci-evidence/m1-value-sdk
            cp -RL result-m1-sdk-product ci-evidence/m1-value-sdk-product
            nix path-info --json ./result-m1-sdk ./result-m1-sdk-product > ci-evidence/m1-sdk-nix-output.json
          fi
          if [[ "${{ github.head_ref }}" == impl/m1-contract-authoring || "${{ github.head_ref }}" == impl/m1-architecture-consolidation || "${{ github.head_ref }}" == impl/m1-only-runtime || "${{ github.head_ref }}" == impl/m1-authoring-acceptance ]]; then
            nix build .#checks.x86_64-linux.m1-native-authoring --out-link result-m1-authoring
            cp -RL result-m1-authoring ci-evidence/m1-native-authoring
            nix path-info --json ./result-m1-authoring > ci-evidence/m1-authoring-nix-output.json
          fi
          cp -RL result-conformance/* ci-evidence/
          git rev-parse HEAD > ci-evidence/kernel-commit.txt
          nix path-info --json ./result-conformance > ci-evidence/nix-output.json
          nix --version > ci-evidence/nix-version.txt
          printf '%s\n' "$GITHUB_RUN_ID" > ci-evidence/ci-run.txt
      - uses: actions/upload-artifact@v4
        with:
          name: minimal-kernel-evidence-${{ github.sha }}
          path: ci-evidence
