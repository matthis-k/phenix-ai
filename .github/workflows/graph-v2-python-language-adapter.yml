name: Graph V2 native Python language adapter conformance
on:
  pull_request:
    paths:
      - "experiments/graph-v2-python/**"
      - ".github/workflows/graph-v2-python-language-adapter.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  graph-v2-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.1"
          components: rustfmt
      - name: Compile Rust provider, Python adapter and real Graph V2 runner
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          rustc --version
          objcopy --version | head -1
          cargo fmt --manifest-path experiments/graph-v2-python/Cargo.toml --all --check
          cargo build --manifest-path experiments/graph-v2-python/Cargo.toml --workspace
          cargo build --manifest-path examples/Cargo.toml -p example-provider
      - name: Package both independent ABI-3 libraries using Phenix offline descriptor extractor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/phenix-v2-python-package/lib /tmp/phenix-v2-rust-package/lib
          cp experiments/graph-v2-python/target/debug/libphenix_python_host_fixture.so /tmp/phenix-v2-python-package/lib/plugin.so
          cp examples/target/debug/libexample_provider.so /tmp/phenix-v2-rust-package/lib/plugin.so
          for pkg in /tmp/phenix-v2-python-package /tmp/phenix-v2-rust-package; do
            cargo run -q --manifest-path Cargo.toml -p phenix-artifact --bin phenix-describe -- "$pkg/lib/plugin.so" "$pkg/descriptor.bin" > "$pkg/digests.json"
            python3 - "$pkg" <<'PY'
          import json, pathlib, sys
          package = pathlib.Path(sys.argv[1])
          record = {
              "format": "phenix.native-package.v2",
              "artifact": "lib/plugin.so",
              "descriptor": "descriptor.bin",
              "target": "x86_64-unknown-linux-gnu",
              **json.loads((package / "digests.json").read_text()),
          }
          (package / "package.json").write_text(json.dumps(record, sort_keys=True))
          PY
          done
      - name: Run real Graph V2 positive and failure/authority verification
        shell: bash
        run: |
          set -euo pipefail
          cargo run --manifest-path experiments/graph-v2-python/Cargo.toml -p phenix-python-kernel-verification -- \
            /tmp/phenix-v2-python-package /tmp/phenix-v2-rust-package /tmp/phenix-v2-graph-artifacts
