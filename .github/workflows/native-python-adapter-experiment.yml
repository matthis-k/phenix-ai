name: Python language adapter cross-plugin ABI test
on:
  pull_request:
    paths:
      - "experiments/native-abi/**"
      - ".github/workflows/native-python-adapter-experiment.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build Python runtime adapter and calling plugin as independent shared libraries
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3-config --includes --embed --ldflags
          cc -std=c11 -Wall -Wextra -Werror -fPIC -shared \
            -o /tmp/libphenix_python_adapter.so \
            experiments/native-abi/language-adapter/python-runtime-adapter.c \
            $(python3-config --includes) $(python3-config --embed --ldflags) -pthread
          cc -std=c11 -Wall -Wextra -Werror -fPIC -shared \
            -o /tmp/libphenix_calling_plugin.so \
            experiments/native-abi/language-adapter/cross-plugin-relay.c -ldl
          for kind in 1 2 3; do
            cc -std=c11 -Wall -Wextra -Werror -DBAD_KIND="$kind" -fPIC -shared \
              -o "/tmp/libphenix_bad_${kind}.so" \
              experiments/native-abi/language-adapter/bad-abi-fixture.c
          done
          cc -std=c11 -Wall -Wextra -Werror \
            -o /tmp/phenix_python_cross_plugin_tests \
            experiments/native-abi/language-adapter/cross-plugin-tests.c -ldl
      - name: Execute positive and negative cross-plugin tests
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/experiments/native-abi/language-adapter/python
        run: |
          set -euo pipefail
          /tmp/phenix_python_cross_plugin_tests \
            /tmp/libphenix_calling_plugin.so \
            /tmp/libphenix_python_adapter.so \
            /tmp/libphenix_bad_1.so \
            /tmp/libphenix_bad_2.so \
            /tmp/libphenix_bad_3.so
      - name: Validate Python plugin pure domain behavior
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/experiments/native-abi/language-adapter/python
        run: |
          python3 - <<'PY'
          from phenix_plugin_v1 import Plugin as V1
          from phenix_plugin_v2 import Plugin as V2
          p = V1()
          assert p.invoke("alpha beta", 4, 2, 0) == (9, 1)
          assert V2().invoke("alpha beta", 4, 2, 0) == (109, 1)
          try:
              p.invoke("raise", 1, 1, 0)
          except RuntimeError:
              pass
          else:
              raise AssertionError("expected Python exception")
          assert p.calls == 1
          PY
