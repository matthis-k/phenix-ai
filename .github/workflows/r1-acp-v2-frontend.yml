# Keep the draft ACP v2 typed adapter compiling on its own feature path.
# The released ACP host remains stable v1 until the v2 lifecycle gates pass.
name: R1 ACP v2 native frontend

on:
  pull_request:
    paths:
      - "crates/phenix-plugin-basic-frontends/**"
      - "crates/phenix-basic-contracts/**"
      - "crates/phenix-basic-runtime/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/r1-acp-v2-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typed-v1-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Temporary report of exact workspace lock repair
        run: |
          set -euo pipefail
          cargo update --workspace
          echo '<<<BEGIN_LOCK_DIFF>>>'
          git diff -- Cargo.lock
          echo '<<<END_LOCK_DIFF>>>'
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test official v2 schema adapter, including v1 coexistence
        run: cargo test --locked -p phenix-plugin-basic-frontends --no-default-features --features acp_v2
      - name: Test stable v1 adapter independently
        run: cargo test --locked -p phenix-plugin-basic-frontends --no-default-features --features acp
      - name: Lint official v2 frontend
        run: cargo clippy --locked -p phenix-plugin-basic-frontends --no-default-features --features acp_v2 --all-targets -- -D warnings
      - name: Lint stable v1 frontend
        run: cargo clippy --locked -p phenix-plugin-basic-frontends --no-default-features --features acp --all-targets -- -D warnings
      - name: Check packaged host crate still compiles
        run: cargo check --locked -p phenix-basic-runtime
      - name: Check opt-in official SDK v1/v2 router compiles
        run: cargo check --locked -p phenix-basic-runtime --features acp_v2_preview
