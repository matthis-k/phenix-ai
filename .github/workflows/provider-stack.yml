name: Provider stack functional tests
on:
  pull_request:
  push:
    branches:
      - feat/m1-provider-base-plugin-20261017
permissions:
  contents: read
jobs:
  provider:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile and test provider contracts, codecs, vault, catalog and plugin
        run: |
          set -euo pipefail
          trap 'git diff -- Cargo.lock' EXIT
          cargo test \
            -p phenix-provider-contracts \
            -p phenix-provider-discovery \
            -p phenix-provider-protocols \
            -p phenix-provider-credential-files \
            -p phenix-provider-builtins \
            -p phenix-plugin-provider-builtins
