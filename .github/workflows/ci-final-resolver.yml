name: Resolve incremental CI final generator

on:
  push:
    branches:
      - perf/dependency-derived-incremental-pr-ci

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: Resolve inputs and generated workflow
        run: |
          set -euo pipefail
          nix flake lock --update-input phenix-flake-ci
          echo LOCK_NODE_BEGIN
          jq -c '.nodes["phenix-flake-ci"]' flake.lock
          echo LOCK_NODE_END
          system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          nix eval --raw ".#packages.$system.phenix-maintenance.phenixMaintenance.ci.github.workflow" > /tmp/generated.yml
          echo WORKFLOW_BEGIN
          cat /tmp/generated.yml
          echo WORKFLOW_END
