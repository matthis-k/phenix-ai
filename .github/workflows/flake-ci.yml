name: "Flake CI"
on:
  pull_request:
  push:
    branches:
      - "main"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  flake-checks:
    uses: matthis-k/phenix-flake-ci/.github/workflows/flake-checks.yml@74f159024df19a0b12cc52c9e6697c7c9ccd48bc
    with:
      config: "ci/flake-check-config.nix"
      library_ref: "74f159024df19a0b12cc52c9e6697c7c9ccd48bc"
