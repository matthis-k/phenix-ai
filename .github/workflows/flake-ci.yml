name: "Flake CI"
on:
  pull_request:
  push:
    branches:
      - "main"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  flake-checks:
    uses: matthis-k/phenix-flake-ci/.github/workflows/flake-checks.yml@5ca9d5ba929c334c7c745804d3575bb42972f5d2
    with:
      config: "ci/flake-check-config.nix"
      library_ref: "5ca9d5ba929c334c7c745804d3575bb42972f5d2"
