name: "FBP Q2 Single-Clone Mixed Admission and Revocation Paired A/B"
on:
  pull_request:
    paths:
      - "packages/phenix-graphs/benches/q2_connected.rs"
      - "packages/phenix-graphs/benches/q2_connected_revoke.rs"
      - "packages/phenix-graphs/Cargo.toml"
      - ".github/workflows/fbp-q2-single-clone-paired.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fbp-q2-single-clone-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  paired-single-clone:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - name: Paired exact-source one-clone vs two-clone Composer mutations
        env:
          CONTROL: cc752b20d54bcfe01a03d5976bf2ced014505a8e
          OPTIMIZED: 2484ab7120b457e5bae3f65d6d352cd7dc90391a
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git fetch --no-tags origin "$CONTROL" "$OPTIMIZED"
          ADD="packages/phenix-graphs/benches/q2_connected.rs"
          REVOKE="packages/phenix-graphs/benches/q2_connected_revoke.rs"
          for path in "$ADD" "$REVOKE" packages/phenix-graphs/Cargo.toml; do
            test "$(git rev-parse "$CONTROL:$path")" = "$(git rev-parse "$OPTIMIZED:$path")"
          done
          {
            echo "control=$CONTROL"
            echo "optimized=$OPTIMIZED"
            echo "addition_blob=$(git rev-parse "$CONTROL:$ADD")"
            echo "removal_blob=$(git rev-parse "$CONTROL:$REVOKE")"
            date -u +%FT%TZ
            lscpu | grep -E '^(Architecture|CPU\\(s\\)|Model name|CPU max MHz|CPU min MHz):' || true
            nix --version
          } | tee artifacts/environment.txt
          for repetition in 1 2 3; do
            if (( repetition % 2 == 1 )); then
              order="control optimized"
            else
              order="optimized control"
            fi
            for variant in $order; do
              if [ "$variant" = "control" ]; then sha="$CONTROL"; else sha="$OPTIMIZED"; fi
              git -c advice.detachedHead=false checkout --force "$sha"
              test "$(git rev-parse HEAD)" = "$sha"
              echo "=== run=$repetition variant=$variant source=$sha ==="
              nix develop --command cargo bench --locked -q -p phenix-graph --bench q2_connected --bench q2_connected_revoke | tee "artifacts/${variant}-${repetition}.txt"
            done
          done
      - name: Preserve raw samples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: q2-single-clone-paired-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/
          if-no-files-found: error
