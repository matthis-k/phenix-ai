name: Temporary C13c Rust format
on:
  push:
    branches:
      - feat/c13c-siwc-verified-tokens-20261022
    paths:
      - .github/workflows/c13c-format-fix.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply cargo fmt to generic OIDC implementation
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          git add crates
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(c13c): format reusable OAuth identity strategy'
            git push origin HEAD:feat/c13c-siwc-verified-tokens-20261022
          fi
