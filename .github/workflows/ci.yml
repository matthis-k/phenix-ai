# Temporary measurement workflow for PR #650 CI experiments.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-nix-plugin-packaging:
    name: "Nix benchmark / plugin packaging"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto

      - name: "Nix plugin packaging checks"
        env:
          CARGO_HOME: "${{ runner.temp }}/phenix-cargo-home"
          CARGO_TARGET_DIR: "${{ runner.temp }}/phenix-cargo-target"
          CARGO_TERM_QUIET: "true"
        run: "printf '%s\\n' '{\"command\":\"jobs/product-nix-plugin-packaging\",\"source\":{\"job\":\"product-nix-plugin-packaging\",\"type\":\"github-actions\"}}' | nix run --quiet .#phenix-maintenance-command-0a36484c4403 -- invoke"

  product-nix-phenix-products:
    name: "Nix benchmark / Phenix products"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto

      - name: "Nix Phenix product checks"
        env:
          CARGO_HOME: "${{ runner.temp }}/phenix-cargo-home"
          CARGO_TARGET_DIR: "${{ runner.temp }}/phenix-cargo-target"
          CARGO_TERM_QUIET: "true"
        run: "printf '%s\\n' '{\"command\":\"jobs/product-nix-phenix-products\",\"source\":{\"job\":\"product-nix-phenix-products\",\"type\":\"github-actions\"}}' | nix run --quiet .#phenix-maintenance-command-c7839ddf2d44 -- invoke"

  product-nix-stitch:
    name: "Nix benchmark / Stitch"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto

      - name: "Nix Stitch checks"
        env:
          CARGO_HOME: "${{ runner.temp }}/phenix-cargo-home"
          CARGO_TARGET_DIR: "${{ runner.temp }}/phenix-cargo-target"
          CARGO_TERM_QUIET: "true"
        run: "printf '%s\\n' '{\"command\":\"jobs/product-nix-stitch\",\"source\":{\"job\":\"product-nix-stitch\",\"type\":\"github-actions\"}}' | nix run --quiet .#phenix-maintenance-command-b9229d9f0034 -- invoke"

