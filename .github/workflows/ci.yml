# Temporary measurement workflow for PR #650 CI experiments.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-nix-checks:
    name: "Nix benchmark / combined cached"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: "phenix-nix-${{ runner.os }}-${{ github.job }}-${{ hashFiles('flake.lock') }}-${{ github.sha }}"
          restore-prefixes-first-match: |
            phenix-nix-${{ runner.os }}-${{ github.job }}-${{ hashFiles('flake.lock') }}-
          gc-max-store-size-linux: "4G"

      - name: "Nix integration and product checks"
        env:
          CARGO_HOME: "${{ runner.temp }}/phenix-cargo-home"
          CARGO_TARGET_DIR: "${{ runner.temp }}/phenix-cargo-target"
          CARGO_TERM_QUIET: "true"
        run: "printf '%s\\n' '{\"command\":\"jobs/product-nix-checks\",\"source\":{\"job\":\"product-nix-checks\",\"type\":\"github-actions\"}}' | nix run --quiet .#phenix-maintenance-command-dd7ea939f014 -- invoke"

