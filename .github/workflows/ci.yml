        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"


  checks:
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    name: "Maintenance checks"
    needs:
      - source
      - clippy
      - build-rust-workspace
      - build-stitch-mcp
      - integration-backend-acp
      - integration-plugin-packaging
      - product-phenix-lua-binding
      - product-phenix-runtime
      - runtime-process-roundtrip
      - runtime-stitch
      - test-adapter-domain
      - test-docs
      - test-harness
      - test-sdk
      - test-unit
    runs-on: ubuntu-latest
    steps:
      - name: Verify all maintenance jobs passed
        run: |
          set -euo pipefail
          [[ '${{ needs.source.result }}' == success ]]
          [[ '${{ needs.clippy.result }}' == success ]]
          [[ '${{ needs.build-rust-workspace.result }}' == success ]]
          [[ '${{ needs.build-stitch-mcp.result }}' == success ]]
          [[ '${{ needs.integration-backend-acp.result }}' == success ]]
          [[ '${{ needs.integration-plugin-packaging.result }}' == success ]]
          [[ '${{ needs.product-phenix-lua-binding.result }}' == success ]]
          [[ '${{ needs.product-phenix-runtime.result }}' == success ]]
          [[ '${{ needs.runtime-process-roundtrip.result }}' == success ]]
          [[ '${{ needs.runtime-stitch.result }}' == success ]]
          [[ '${{ needs.test-adapter-domain.result }}' == success ]]
          [[ '${{ needs.test-docs.result }}' == success ]]
          [[ '${{ needs.test-harness.result }}' == success ]]
          [[ '${{ needs.test-sdk.result }}' == success ]]
          [[ '${{ needs.test-unit.result }}' == success ]]
