# Temporary measurement workflow for PR #655.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-plugin-packaging:
    name: "Nix benchmark / packaging wrapper"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto
      - name: "Plugin packaging integration"
        env:
          CARGO_HOME: "${{ runner.temp }}/phenix-cargo-home"
          CARGO_TARGET_DIR: "${{ runner.temp }}/phenix-cargo-target"
          CARGO_TERM_QUIET: "true"
        run: "printf '%s\\n' '{\"command\":\"jobs/integration-plugin-packaging\",\"source\":{\"job\":\"integration-plugin-packaging\",\"type\":\"github-actions\"}}' | nix run --quiet .#phenix-maintenance-command-e0dcc81ccb75 -- invoke"

  product-phenix-runtime:
    name: "Nix benchmark / real product runtime"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto
      - name: "Phenix supported runtime journey"
        env:
          CARGO_HOME: "${{ runner.temp }}/phenix-cargo-home"
          CARGO_TARGET_DIR: "${{ runner.temp }}/phenix-cargo-target"
          CARGO_TERM_QUIET: "true"
        run: "printf '%s\\n' '{\"command\":\"jobs/product-phenix-runtime\",\"source\":{\"job\":\"product-phenix-runtime\",\"type\":\"github-actions\"}}' | nix run --quiet .#phenix-maintenance-command-5bfe8a5b5d52 -- invoke"

  product-phenix-lua-binding:
    name: "Nix benchmark / Lua product fixture"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto
      - name: "Phenix Lua binding product fixture"
        env:
          CARGO_HOME: "${{ runner.temp }}/phenix-cargo-home"
          CARGO_TARGET_DIR: "${{ runner.temp }}/phenix-cargo-target"
          CARGO_TERM_QUIET: "true"
        run: "printf '%s\\n' '{\"command\":\"jobs/product-phenix-lua-binding\",\"source\":{\"job\":\"product-phenix-lua-binding\",\"type\":\"github-actions\"}}' | nix run --quiet .#phenix-maintenance-command-c3ad7e345430 -- invoke"
