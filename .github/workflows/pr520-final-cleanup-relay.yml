name: PR 520 final cleanup relay

on:
  push:
    branches:
      - refactor/durable-collections
    paths:
      - .github/workflows/pr520-final-cleanup-relay.yml
      - .phenix/pr520-final-cleanup.py

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/durable-collections
          fetch-depth: 0
      - name: Apply final cleanup
        run: python .phenix/pr520-final-cleanup.py
      - name: Remove relay files
        run: |
          rm .phenix/pr520-final-cleanup.py .github/workflows/pr520-final-cleanup-relay.yml
          rmdir .phenix || true
      - name: Format
        working-directory: rust
        run: cargo fmt --all
      - name: Test SDK durable collections
        working-directory: rust
        run: cargo test -p phenix-sdk durable
      - name: Test SDK package
        working-directory: rust
        run: cargo test -p phenix-sdk
      - name: Test core persistence
        working-directory: rust
        run: cargo test -p phenix-core persistence
      - name: Clippy SDK
        working-directory: rust
        run: cargo clippy -p phenix-sdk --all-targets -- -D warnings
      - name: Push implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: isolate durable collection layouts"
          git push origin HEAD:refactor/durable-collections
