name: PR 520 feature cleanup relay

on:
  push:
    branches:
      - refactor/durable-collections
    paths:
      - .github/workflows/pr520-feature-cleanup-relay.yml
      - .phenix/pr520-feature-cleanup.py
      - .phenix/pr520-feature-cleanup-pre.py

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/durable-collections
          fetch-depth: 0
      - name: Apply feature cleanup
        run: |
          python .phenix/pr520-feature-cleanup-pre.py
          python .phenix/pr520-feature-cleanup.py
      - name: Remove relay files
        run: |
          rm .phenix/pr520-feature-cleanup.py .phenix/pr520-feature-cleanup-pre.py .github/workflows/pr520-feature-cleanup-relay.yml
          rmdir .phenix || true
      - name: Format
        working-directory: rust
        run: cargo fmt --all
      - name: Test core persistence
        working-directory: rust
        run: cargo test -p phenix-core persistence
      - name: Test SDK authoring
        working-directory: rust
        run: cargo test -p phenix-sdk
      - name: Test SDK macros
        working-directory: rust
        run: cargo test -p phenix-sdk-macros
      - name: Test harness persistence
        working-directory: rust
        run: cargo test -p phenix-harness persistence
      - name: Push implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: make persistence features operational"
          git push origin HEAD:refactor/durable-collections
