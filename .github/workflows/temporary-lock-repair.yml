name: Temporary dependency lock repair
on:
  push:
    branches: [feat/provider-event-registry-20261025]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Repair workspace lock without changing registry versions
        run: |
          set -euo pipefail
          cargo update --workspace
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          echo '<<<BEGIN_LOCK_DIFF>>>'
          git diff --no-ext-diff -- Cargo.lock
          echo '<<<END_LOCK_DIFF>>>'
