# Temporary exact-head repair; remove after the source repair lands.
name: PR 504 final compile fix

on:
  push:
    branches: [spec/nvim-client-package]

concurrency:
  group: pr504-final-compile-fix
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spec/nvim-client-package
          fetch-depth: 0
      - name: Fix exact-head contract migration
        run: |
          cargo run --manifest-path rust/Cargo.toml --locked -q \
            -p phenix-application-interface \
            --bin phenix-application-descriptor -- \
            --rust share/phenix/interfaces/phenix.application@1.json \
            > rust/crates/phenix-application-interface/fixtures/application.rs
          python3 - <<'PY'
          from pathlib import Path

          review = Path('rust/crates/phenix-plugin-execution/src/review.rs')
          text = review.read_text()
          old = '''    use phenix_core::{\n        Authority, CapabilityId, Kernel, KernelConfig, LocalPersistence, PluginExecution, PluginId,\n        PluginManifest, ServiceContribution,\n    };'''
          new = '''    use phenix_core::{\n        Authority, CapabilityId, Kernel, KernelConfig, LocalPersistence, PluginExecution, PluginId,\n        PluginManifest, Project, ServiceContribution,\n    };'''
          if old not in text:
              raise SystemExit('execution review test import shape changed')
          review.write_text(text.replace(old, new, 1))

          transport = Path('rust/crates/phenix-acp-stdio/src/transport.rs')
          text = transport.read_text()
          old = '''mod tests {\n    use super::*;\n    use phenix_core::{'''
          new = '''mod tests {\n    use super::*;\n    use phenix_application_interface::types::ElicitationHandlerRef;\n    use phenix_core::{'''
          if old not in text:
              raise SystemExit('ACP transport test import shape changed')
          transport.write_text(text.replace(old, new, 1))

          harness = Path('rust/crates/phenix-harness/tests/supported_product_journeys.rs')
          text = harness.read_text()
          old = '''    Authority, CapabilityGenerationId, ComponentManifest, ModelId, PhenixValue, PluginExecution,\n    PluginHost, PluginId, PluginInstance, PluginManifest, Project, RoutingProfileId,\n    ServiceContribution, ServiceId, ValueError,'''
          new = '''    Authority, CapabilityGenerationId, ComponentManifest, ModelId, PhenixValue, PluginExecution,\n    PluginHost, PluginId, PluginInstance, PluginManifest, Project, RoutingProfileId,\n    ServiceContribution, ServiceId, SessionId, ValueError,'''
          if old not in text:
              raise SystemExit('harness core import shape changed')
          text = text.replace(old, new, 1)
          old = '''    RoutingProfile, SessionCommand, SessionResponse, SessionTreeCommand, SessionTreeResponse,\n    WorkspaceCommand, WorkspaceResponse,'''
          new = '''    RoutingProfile, SessionCommand, SessionRecord, SessionResponse, SessionTreeCommand,\n    SessionTreeResponse, WorkspaceCommand, WorkspaceResponse,'''
          if old not in text:
              raise SystemExit('harness catalog import shape changed')
          text = text.replace(old, new, 1)
          old = '''    invoke(\n        &mut harness,\n        "phenix.sessions@1",\n        json!({"operation": "create", "id": "root"}),\n    );\n    invoke(\n        &mut harness,\n        "phenix.sessions@1",\n        json!({"operation": "create", "id": "child"}),\n    );'''
          new = '''    let _: SessionResponse = invoke_structural(\n        &mut harness,\n        "phenix.sessions@1",\n        &SessionCommand::Create {\n            session: SessionRecord::new(SessionId::parse("root").unwrap()),\n        },\n    );\n    let _: SessionResponse = invoke_structural(\n        &mut harness,\n        "phenix.sessions@1",\n        &SessionCommand::Create {\n            session: SessionRecord::new(SessionId::parse("child").unwrap()),\n        },\n    );'''
          if old not in text:
              raise SystemExit('harness session create fixture shape changed')
          harness.write_text(text.replace(old, new, 1))

          domain = Path('rust/crates/phenix-domain/src/client_tools.rs')
          text = domain.read_text()
          old = '''        let id = ClientToolAdmissionId::parse(format!("client-tool-{}", self.next_id))\n            .expect("generated client tool admission ids are valid");'''
          new = '''        // Admission handles cross the ACP connection boundary. Include the callable\n        // generation so a stale handle from a retired connection can never alias\n        // the first admission created by a later connection.\n        let id = ClientToolAdmissionId::parse(format!(\n            "client-tool-{}-{}",\n            tool.invoke.generation(),\n            self.next_id\n        ))\n        .expect("generated client tool admission ids are valid");'''
          if old not in text:
              raise SystemExit('client tool admission allocator shape changed')
          domain.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --manifest-path rust/Cargo.toml --all
          git diff --check
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(nvim): finish exact-head contract migration'
          git push origin HEAD:spec/nvim-client-package
      - name: Focused Rust regression tests
        run: |
          cargo test --manifest-path rust/Cargo.toml \
            -p phenix-domain \
            -p phenix-application-interface \
            -p phenix-plugin-memory \
            -p phenix-plugin-session-tree \
            -p phenix-plugin-execution \
            -p phenix-acp-stdio \
            -p phenix-harness \
            --all-targets
