name: PR 504 finalize migration

on:
  push:
    branches: [spec/nvim-client-package]

concurrency:
  group: pr504-finalize-migration
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spec/nvim-client-package
      - name: Apply migration and binary module fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/pr504-lifecycle-fix.yml').read_text().splitlines()
          start = workflow.index("          python3 - <<'PY'") + 1
          end = workflow.index('          PY', start)
          source = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end])
          exec(compile(source, 'pr504-lifecycle-fix.py', 'exec'))

          runtime = Path('rust/crates/phenix-harness/src/runtime_config.rs')
          text = runtime.read_text()
          old = 'use crate::{default_suite_authority, PhenixHarness};\n'
          new = 'use super::{default_suite_authority, PhenixHarness};\n'
          if text.count(old) != 1:
              raise SystemExit(f'runtime-config module import: found {text.count(old)} anchors')
          runtime.write_text(text.replace(old, new, 1))

          main = Path('rust/crates/phenix-harness/src/main.rs')
          text = main.read_text()
          old = 'use phenix_harness::{default_suite_authority, HarnessBuilder};\n'
          new = 'use phenix_harness::{default_suite_authority, HarnessBuilder, PhenixHarness};\n'
          if text.count(old) != 1:
              raise SystemExit(f'main harness import: found {text.count(old)} anchors')
          main.write_text(text.replace(old, new, 1))
          PY
      - name: Format and targeted test
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo test --manifest-path rust/Cargo.toml -p phenix-harness prompt_journal_failure_finishes_prepared_root_execution
      - name: Commit migration
        run: |
          rm .github/workflows/pr504-lifecycle-fix.yml
          rm .github/workflows/pr504-finalize-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(nvim): serialize mutable runtime access'
          git push origin HEAD:spec/nvim-client-package
