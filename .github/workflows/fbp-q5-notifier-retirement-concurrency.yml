name: "FBP Q5 Notifier Retirement Concurrency"
on:
  pull_request:
    paths:
      - "packages/phenix-graphs/src/runtime/wake.rs"
      - "packages/phenix-graphs/tests/fbp_notifier_retirement_interleavings.rs"
      - "docs/fbp-q5-notifier-retirement-interleavings-20261113.md"
      - ".github/workflows/fbp-q5-notifier-retirement-concurrency.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notifier-retirement:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - name: Capture exact commit, compiler and CPU topology
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            echo "candidate=$(git rev-parse HEAD)"
            echo "workflow_sha=$GITHUB_SHA"
            date -u +%FT%TZ
            uname -a
            lscpu | grep -E '^(Architecture|CPU\(s\)|Model name):' || true
            nix --version
            nix develop --command rustc -vV
          } > artifacts/environment.txt
          sha256sum packages/phenix-graphs/src/runtime/wake.rs \
            packages/phenix-graphs/tests/fbp_notifier_retirement_interleavings.rs \
            > artifacts/source-hashes.txt
          cat artifacts/environment.txt
          cat artifacts/source-hashes.txt
      - name: Repeat real threaded retirement and listener tests eight times
        shell: bash
        run: |
          set -euo pipefail
          export RUST_BACKTRACE=1
          for repetition in 1 2 3 4 5 6 7 8; do
            nix develop --command cargo test --locked -q \
              -p phenix-graph --lib \
              runtime::wake::tests:: -- --test-threads=1 \
              > "artifacts/unit-$repetition.log" 2>&1 || {
                cat "artifacts/unit-$repetition.log"
                exit 1
              }
            nix develop --command cargo test --locked -q \
              -p phenix-graph --test fbp_notifier_retirement_interleavings \
              -- --test-threads=1 \
              > "artifacts/integration-$repetition.log" 2>&1 || {
                cat "artifacts/integration-$repetition.log"
                exit 1
              }
            echo "repetition $repetition: internal wake + compiled-session races passed"
            tail -n 3 "artifacts/unit-$repetition.log"
            tail -n 3 "artifacts/integration-$repetition.log"
          done
      - name: Preserve CI evidence and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fbp-q5-notifier-retirement-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/
          if-no-files-found: warn
