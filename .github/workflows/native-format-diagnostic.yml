name: Native format diagnostic
on:
  push:
    branches:
      - feat/native-abi-loader-extraction

permissions:
  contents: read

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c
      - name: Print canonical native loader formatting diff
        run: |
          printf '%s\n' '{"command":"check/source/rust-format","source":{"job":"source","type":"github-actions"}}' | nix run --quiet .#phenix-maintenance-command-31a6c0b16724 -- invoke || true
          nix develop --command bash -c 'set -x; command -v rustfmt; rustfmt --version; cd rust; cargo fmt --all --check || true; cargo fmt --all'
          git diff -- rust/crates/phenix-native-loader/src/lib.rs
          git diff -- rust/crates/phenix-plugin-abi/src/lib.rs
