name: "FBP H7 Request Work Paired Benchmark"
on:
  pull_request:
    paths:
      - "packages/phenix-graphs/src/runtime/request.rs"
      - "packages/phenix-graphs/examples/fbp_request_work_benchmark.rs"
      - ".github/workflows/fbp-h7-request-work-paired.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-request-work:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
      - name: Checkout exact pre-optimization integration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 1ea3be140724388638005b20c52fb14ea5d096c5
          path: baseline
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - name: Capture exact source and CPU provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            git -C candidate rev-parse HEAD
            git -C baseline rev-parse HEAD
            uname -a
            lscpu | grep -E '^(Architecture|CPU\(s\)|Model name|CPU max MHz|CPU min MHz):' || true
            nix --version
          } > artifacts/environment.txt
          cp candidate/packages/phenix-graphs/examples/fbp_request_work_benchmark.rs \
            baseline/packages/phenix-graphs/examples/fbp_request_work_benchmark.rs
          cmp candidate/packages/phenix-graphs/examples/fbp_request_work_benchmark.rs \
            baseline/packages/phenix-graphs/examples/fbp_request_work_benchmark.rs
          test "$(git -C candidate hash-object packages/phenix-graphs/Cargo.toml)" = \
               "$(git -C baseline hash-object packages/phenix-graphs/Cargo.toml)"
          sha256sum candidate/packages/phenix-graphs/examples/fbp_request_work_benchmark.rs \
            baseline/packages/phenix-graphs/examples/fbp_request_work_benchmark.rs \
            > artifacts/source-sha256.txt
      - name: Compile identical benchmark into both production runtimes
        shell: bash
        run: |
          set -euo pipefail
          for variant in baseline candidate; do
            (cd "$variant" && nix develop --command cargo build --locked --release -q \
              -p phenix-graph --example fbp_request_work_benchmark)
          done
      - name: Three interleaved same-runner comparisons
        shell: bash
        run: |
          set -euo pipefail
          for repeat in 1 2 3; do
            if (( repeat % 2 == 1 )); then order=(baseline candidate)
            else order=(candidate baseline); fi
            for variant in "${order[@]}"; do
              (cd "$variant" && ./target/release/examples/fbp_request_work_benchmark) \
                > "artifacts/${variant}-${repeat}.csv"
              echo "variant=${variant} repeat=${repeat}"
              cat "artifacts/${variant}-${repeat}.csv"
            done
          done
      - name: Upload raw timing and environment
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fbp-h7-request-work-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/
          if-no-files-found: warn
