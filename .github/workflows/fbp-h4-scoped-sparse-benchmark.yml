name: "FBP H4 Live Request Sparse Paired Benchmark"
on:
  pull_request:
    paths:
      - "packages/phenix-graphs/examples/fbp_scoped_sparse_benchmark.rs"
      - "packages/phenix-graphs/src/runtime/mod.rs"
      - ".github/workflows/fbp-h4-scoped-sparse-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-h4-scoped-sparse:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact scoped candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
      - name: Checkout verified PR1300 baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 516e0883875d5ec483e3595d50b77b3d5e8979c4
          path: baseline
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - name: Record exact commits, benchmark source and machine provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp candidate/packages/phenix-graphs/examples/fbp_scoped_sparse_benchmark.rs \
            baseline/packages/phenix-graphs/examples/fbp_scoped_sparse_benchmark.rs
          sha256sum candidate/packages/phenix-graphs/examples/fbp_scoped_sparse_benchmark.rs \
            baseline/packages/phenix-graphs/examples/fbp_scoped_sparse_benchmark.rs \
            > artifacts/source-hashes.txt
          {
            echo "baseline=$(git -C baseline rev-parse HEAD)"
            echo "candidate=$(git -C candidate rev-parse HEAD)"
            echo "workflow_sha=$GITHUB_SHA"
            date -u +%FT%TZ
            uname -a
            lscpu | grep -E '^(Architecture|CPU\(s\)|Model name|CPU max MHz|CPU min MHz):' || true
            nix --version
            (cd baseline && nix develop --command rustc -vV)
            (cd candidate && nix develop --command rustc -vV)
          } > artifacts/environment.txt
          cat artifacts/source-hashes.txt
          cat artifacts/environment.txt
      - name: Compile paired release workloads without copying production code
        shell: bash
        run: |
          set -euo pipefail
          for variant in baseline candidate; do
            (cd "$variant" && nix develop --command cargo build --locked --release -q -p phenix-graph \
              --example fbp_scoped_sparse_benchmark --example fbp_benchmark --example fbp_closure_benchmark)
          done
      - name: Three interleaved paired runs including unscoped and closure controls
        shell: bash
        run: |
          set -euo pipefail
          for repetition in 1 2 3; do
            if (( repetition % 2 == 1 )); then
              order=(baseline candidate)
            else
              order=(candidate baseline)
            fi
            for variant in "${order[@]}"; do
              (cd "$variant" && ./target/release/examples/fbp_scoped_sparse_benchmark \
                5000 1 16 64 256) > "artifacts/${variant}-scoped-${repetition}.csv"
              (cd "$variant" && ./target/release/examples/fbp_benchmark \
                3000 1 16 64 256) > "artifacts/${variant}-unscoped-${repetition}.csv"
              (cd "$variant" && ./target/release/examples/fbp_closure_benchmark \
                80 16 64 128) > "artifacts/${variant}-closure-${repetition}.csv"
              echo "variant=${variant} repetition=${repetition}"
              cat "artifacts/${variant}-scoped-${repetition}.csv"
              cat "artifacts/${variant}-unscoped-${repetition}.csv"
              cat "artifacts/${variant}-closure-${repetition}.csv"
            done
          done
      - name: Preserve raw CSV, source checksums and machine metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fbp-h4-scoped-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/
          if-no-files-found: warn
