[package]
name = "phenix-sdk"
version = "0.1.0"
edition.workspace = true
publish = false

[package.metadata.phenix]
role = "passive-library"

[dependencies]
phenix-contract = { path = "../phenix-contract" }
phenix-core = { path = "../phenix-core" }
phenix-provider-sdk = { path = "../phenix-provider-sdk" }
phenix-sdk-macros = { path = "../phenix-sdk-macros" }
