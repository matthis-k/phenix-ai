[dev-dependencies]
phenix-plugin-api = { path = "../phenix-plugin-api" }
phenix-plugin-options-test = { package = "phenix-plugin-options", path = "../phenix-plugin-options" }
phenix-plugin-sessions-test = { package = "phenix-plugin-sessions", path = "../phenix-plugin-sessions" }
