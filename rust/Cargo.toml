[workspace]
resolver = "2"
members = [
  "crates/phenix-application-interface",
  "crates/phenix-adapter-acp",
  "crates/phenix-acp-stdio",
  "crates/phenix-client-acp",
  "crates/phenix-binding-generator",
  "crates/phenix-binding-lua",
  "crates/phenix-core",
  "crates/phenix-domain",
  "crates/phenix-client",
  "crates/phenix-conductor",
  "crates/phenix-harness",
  "crates/phenix-sdk",
  "crates/phenix-sdk-macros",
  "crates/phenix-plugin-artifacts",
  "crates/phenix-plugin-basic-agent",
  "crates/phenix-plugin-basic-context",
  "crates/phenix-plugin-basic-model",
  "crates/phenix-plugin-basic-skills",
  "crates/phenix-plugin-basic-tools",
  "crates/phenix-plugin-command-toolbelt",
  "crates/phenix-plugin-context",
  "crates/phenix-plugin-debug",
  "crates/phenix-plugin-execution",
  "crates/phenix-plugin-frontend",
  "crates/phenix-plugin-hooks",
  "crates/phenix-plugin-jobs",
  "crates/phenix-plugin-memory",
  "crates/phenix-plugin-models",
  "crates/phenix-plugin-options",
  "crates/phenix-plugin-planning",
  "crates/phenix-plugin-providers",
  "crates/phenix-plugin-repository-workers",
  "crates/phenix-plugin-api",
  "crates/phenix-plugin-sessions",
  "crates/phenix-plugin-session-tree",
  "crates/phenix-plugin-step-runner",
  "crates/phenix-plugin-workspace",
  "crates/phenix-plugin-catalog",
  "crates/phenix-provider-sdk",
  "crates/phenix-backend",
  "crates/phenix-backend-acp",
  "crates/phenix-backend-native",
]

[workspace.dependencies]
agent-client-protocol = { version = "2.0.0", features = ["unstable_auth_methods", "unstable_elicitation", "unstable_end_turn_token_usage", "unstable_session_fork", "unstable_mcp_over_acp"] }
base64 = "0.22"
clap = { version = "4.5.47", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
futures = "0.3"
genai = "0.6.0"
getrandom = "0.4"
jsonschema = "0.33"
mlua = "0.12.1"
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
smallvec = { version = "1", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2"
