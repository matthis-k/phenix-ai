[workspace]
members = ["crates/*", "testing/products/*", "plugins/shared/phenix-plugin-environment", "plugins/shared/phenix-plugin-storage-sqlite", "plugins/shared/phenix-plugin-model-http"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
phenix-contract = { path = "crates/phenix-contract", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
