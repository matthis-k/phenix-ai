[workspace]
resolver = "2"
members = [
  "packages/phenix-schema",
  "packages/phenix-graphs",
  "packages/phenix-graphs/port-args-derive",
  "packages/phenix-plugins",
  "packages/phenix-storage",
  "packages/phenix-storage-graph",
  "packages/phenix-storage-plugin",
  "packages/phenix-kernel",
]

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
