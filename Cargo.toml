[workspace]
members = [
    "crates/phenix-contract",
    "crates/phenix-artifact",
    "crates/phenix-kernel",
    "crates/phenix-macros",
    "crates/phenix-sdk",
    "crates/phenix-basic-contracts",
    "crates/phenix-plugin-model-fixture",
    "crates/phenix-plugin-tool-reverse",
    "crates/phenix-plugin-counter-fixture",
    "crates/phenix-basic-shell",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
phenix-contract = { path = "crates/phenix-contract", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
